<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="Py-Code — editor Python executado no navegador com Pyodide.">
<title>Py-Code | Python no navegador</title>
<style>
:root{--bg:#000;--panel:#050505;--fg:#00ff66;--muted:#74a98b;--border:#00ff66;--editor:#001407}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:"Courier New",monospace}
body{min-height:100dvh;overflow:hidden}
button{font:700 14px "Courier New",monospace;color:var(--fg);background:#001a08;border:1px solid var(--border);padding:10px 12px;border-radius:6px;cursor:pointer;min-height:42px}
button:hover{background:#00310f}button:disabled{opacity:.45;cursor:not-allowed}
header{background:var(--panel);border-bottom:2px solid var(--border);padding:10px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-size:20px;font-weight:800;letter-spacing:2px}.status{font-size:12px;color:var(--muted);min-height:18px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
main{height:calc(100dvh - 89px);display:grid;grid-template-rows:minmax(260px,1fr) minmax(220px,.85fr);min-height:0}
#editor-container{min-height:0;border-bottom:2px solid var(--border);background:var(--editor)}
#display{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,42%);background:#000}
#output{min-width:0;overflow:auto;padding:12px;white-space:pre-wrap;word-break:break-word;border-right:1px solid var(--border);font-size:14px;line-height:1.45}
#game{min-width:0;display:flex;align-items:center;justify-content:center;padding:10px;background:#020202}
canvas{display:block;width:min(100%,500px);height:auto;max-height:100%;aspect-ratio:1;border:1px dashed var(--border);background:#000;image-rendering:pixelated}
.cm-editor{height:100%!important;font-size:14px}
.light{--bg:#f5f5f5;--panel:#fff;--fg:#161616;--muted:#666;--border:#333;--editor:#fff}
.light #output,.light #game{background:#fff}
@media (max-width:800px){
 body{overflow:auto}main{height:auto;min-height:calc(100dvh - 120px);grid-template-rows:52dvh 48dvh}
 #display{grid-template-columns:1fr;grid-template-rows:1fr minmax(180px,36dvh)}
 #output{border-right:0;border-bottom:1px solid var(--border)}#game{min-height:180px}
}
@media (max-width:480px){
 header{padding:8px}.brand{font-size:17px}.controls{width:100%}
 button{padding:9px 10px;font-size:12px;flex:1}.top{align-items:flex-start}
}
</style>
</head>
<body>
<header><div class="top">
<div><div class="brand">PY-CODE</div><div id="status" class="status">Inicializando editor…</div></div>
<div class="controls">
<button id="theme-btn" type="button">TEMA: PRETO</button>
<button id="clear-btn" type="button">LIMPAR</button>
<button id="download-btn" type="button">BAIXAR .PY</button>
<button id="run-btn" type="button" disabled>CARREGANDO…</button>
</div></div></header>
<main>
<section id="editor-container" aria-label="Editor Python"></section>
<section id="display"><pre id="output" aria-live="polite">Preparando o ambiente Python…</pre>
<div id="game"><canvas id="canvas" width="300" height="300" aria-label="Tela gráfica"></canvas></div></section>
</main>
<script src="https://cdn.jsdelivr.net/pyodide/v0.28.2/full/pyodide.js"></script>
<script type="module">
import {EditorView,basicSetup} from "https://esm.sh/codemirror@6.0.1";
import {python} from "https://esm.sh/@codemirror/lang-python@6.1.7";
import {Compartment} from "https://esm.sh/@codemirror/state@6.5.2";
import {EditorView as View} from "https://esm.sh/@codemirror/view@6.36.5";
const $=id=>document.getElementById(id);
const output=$("output"),status=$("status"),run=$("run-btn"),themeBtn=$("theme-btn"),clearBtn=$("clear-btn"),dl=$("download-btn");
const canvas=$("canvas"),ctx=canvas.getContext("2d");let pyodide=null,dark=true;
const terminalTheme=View.theme({"&":{background:"#001407",color:"#00ff66"},".cm-content":{caretColor:"#00ff66"},".cm-cursor":{borderLeftColor:"#00ff66"},".cm-gutters":{background:"#000",color:"#1a6",borderRight:"1px solid #0f6"}},{dark:true});
const lightTheme=View.theme({"&":{background:"#fff",color:"#161616"},".cm-content":{caretColor:"#161616"},".cm-cursor":{borderLeftColor:"#161616"},".cm-gutters":{background:"#f1f1f1",color:"#666",borderRight:"1px solid #333"}},{dark:false});
const themeCompartment=new Compartment();
const defaultCode=`from js import document

print("Olá, Py-Code!")

canvas = document.getElementById("canvas")
ctx = canvas.getContext("2d")

ctx.fillStyle = "#000000"
ctx.fillRect(0, 0, 300, 300)

ctx.fillStyle = "#00ff66"
ctx.fillRect(100, 100, 100, 100)
`;
const editor=new EditorView({doc:defaultCode,extensions:[basicSetup,python(),themeCompartment.of(terminalTheme)],parent:$("editor-container")});
function setOutput(text){output.textContent=String(text??"")}
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height)}
function setStatus(t){status.textContent=t}
themeBtn.onclick=()=>{dark=!dark;document.body.classList.toggle("light",!dark);themeBtn.textContent=dark?"TEMA: PRETO":"TEMA: CLARO";editor.dispatch({effects:themeCompartment.reconfigure(dark?terminalTheme:lightTheme)})};
clearBtn.onclick=()=>{setOutput("");clearCanvas()};
dl.onclick=()=>{const blob=new Blob([editor.state.doc.toString()],{type:"text/x-python;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="game.py";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
async function init(){setStatus("Carregando Pyodide…");try{
for(let i=0;i<50 && typeof loadPyodide!=="function";i++)await new Promise(r=>setTimeout(r,100));
if(typeof loadPyodide!=="function")throw new Error("Pyodide não carregou. Verifique a conexão com a CDN.");
pyodide=await loadPyodide({
  indexURL:"https://cdn.jsdelivr.net/pyodide/v0.28.2/full/",
  stdout:s=>{output.textContent+=(output.textContent?"\n":"")+s},
  stderr:s=>{output.textContent+=(output.textContent?"\n":"")+s}
});
setOutput("PY-CODE ONLINE\nPython pronto para executar no navegador.");setStatus("Ambiente pronto");run.disabled=false;run.textContent="EXECUTAR";
}catch(err){console.error(err);setOutput("ERRO AO INICIAR PYTHON\n\n"+String(err));setStatus("Falha ao carregar Python")}}
run.onclick=async()=>{if(!pyodide)return;run.disabled=true;run.textContent="EXECUTANDO…";setOutput("EXECUTANDO…\n");try{clearCanvas();await pyodide.runPythonAsync(editor.state.doc.toString());output.textContent+="\n\nOK"}catch(err){console.error(err);output.textContent+="\n\nERRO:\n"+String(err)}finally{run.disabled=false;run.textContent="EXECUTAR"}};
window.addEventListener("error",e=>{
  if(e?.message) {
    setStatus("Erro no navegador");
    output.textContent+="\n\nERRO DO NAVEGADOR:\n"+e.message;
  }
});
window.addEventListener("unhandledrejection",e=>{
  const reason=String(e?.reason??"Erro assíncrono");
  setStatus("Erro assíncrono");
  output.textContent+="\n\nERRO ASSÍNCRONO:\n"+reason;
});
clearCanvas();init();
</script></body></html>
