<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="description" content="Py-Code — terminal Python leve no navegador.">
<link rel="manifest" href="./manifest.webmanifest">
<title>Py-Code — Terminal Python</title>
<style>
:root{
  --bg:#000;
  --panel:#0b0b0b;
  --text:#fff;
  --muted:#999;
  --border:#333;
  --editor:#000;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Consolas,"Courier New",monospace}
body{display:flex;flex-direction:column;overflow:hidden}
button{
  border:1px solid #555;background:#111;color:#fff;
  border-radius:2px;padding:8px 12px;font:700 12px Consolas,monospace;
  cursor:pointer;min-height:36px
}
button:hover{background:#fff;color:#000;border-color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
header{
  flex:0 0 auto;border-bottom:1px solid var(--border);
  background:#000;padding:10px 14px
}
.top{display:flex;align-items:center;gap:14px;justify-content:space-between}
.brand{font-size:18px;font-weight:800;letter-spacing:2px;color:#fff}
.sub{font-size:11px;color:var(--muted);margin-top:3px}
.status{font-size:11px;color:#fff}
.controls{display:flex;gap:6px;flex-wrap:wrap}
main{
  flex:1;min-height:0;display:grid;
  grid-template-rows:minmax(300px,1fr) minmax(160px,.65fr) minmax(220px,.75fr);
}
.panel{min-height:0;display:flex;flex-direction:column}
.editor-wrap{flex:1;min-height:0;display:grid;grid-template-columns:48px minmax(0,1fr);background:#000}
.line-numbers{overflow:hidden;padding:14px 8px 14px 0;text-align:right;border-right:1px solid #333;background:#050505;color:#777;font:14px/1.55 Consolas,"Courier New",monospace;user-select:none;white-space:pre}
.editor-wrap #code{height:100%}
.panel-title{
  flex:0 0 auto;height:34px;display:flex;align-items:center;
  justify-content:space-between;padding:0 12px;
  background:#0b0b0b;border-bottom:1px solid var(--border);
  color:#fff;font-size:12px
}
.panel-title span:last-child{color:var(--muted);font-weight:400}
#code{
  flex:1;width:100%;min-height:0;resize:none;border:0;outline:0;
  padding:14px;background:var(--editor);color:#fff;
  font:14px/1.55 Consolas,"Courier New",monospace;
  tab-size:4;white-space:pre;caret-color:#fff
}
#code:focus{box-shadow:inset 2px 0 0 #fff}
#terminal{
  flex:1;min-height:0;overflow:auto;padding:12px 14px;
  background:#000;color:#fff;font:13px/1.55 Consolas,"Courier New",monospace;
  white-space:pre-wrap;word-break:break-word
}
.line{min-height:20px}
.out,.info,.ok,.warn,.err,.prompt{color:#fff}
.meta{color:#999}
.cursor{display:inline-block;width:7px;height:14px;background:var(--green);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
footer{
  flex:0 0 auto;border-top:1px solid var(--border);background:#000;
  color:var(--muted);font-size:10px;padding:5px 10px;display:flex;justify-content:space-between
}
@media(max-width:700px){
  html,body{height:100%;min-height:100%;overflow:hidden}
  header{padding:8px}
  .top{align-items:flex-start;flex-wrap:wrap;gap:7px}
  .brand{font-size:16px}
  .sub{font-size:9px}
  .status{width:100%;order:3}
  .controls{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
  .controls button{min-width:0;padding:7px 4px;font-size:10px}
  main{height:calc(100dvh - 108px);min-height:0;grid-template-rows:minmax(230px,1fr) minmax(140px,.62fr) minmax(200px,.78fr)}
  .panel-title{padding:0 8px}
  .panel-title span:last-child{display:none}
  .editor-wrap{grid-template-columns:40px minmax(0,1fr)}
  .line-numbers,#code{font-size:13px;line-height:1.5}
  #code{padding:12px 10px}
  footer{height:24px;font-size:9px}
  footer span:last-child{display:none}
}

#bot{display:flex;flex-direction:column;min-height:0;background:#050505;border-top:1px solid #333}
#botHead{height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid #333;font-size:12px}
#botMessages{flex:1;min-height:0;overflow:auto;padding:8px 10px}
.bot-msg{padding:7px 8px;margin:0 0 6px;border-left:2px solid #777;font-size:12px;line-height:1.45;white-space:pre-wrap}
.bot-msg.user{border-left-color:#fff;text-align:right}
.bot-actions{display:flex;gap:5px;padding:6px;border-top:1px solid #333}
.bot-actions button{min-height:30px;padding:5px 8px;font-size:10px}
.bot-input{display:flex;gap:5px;padding:6px;border-top:1px solid #333}
.bot-input input{flex:1;min-width:0;background:#000;border:1px solid #333;color:#fff;padding:7px;font:12px monospace;outline:0}
.bot-input button{min-height:32px;padding:5px 9px}
@media(max-width:700px){#bot{min-height:200px}.bot-msg{font-size:11px}}

#auditPanel{position:fixed;inset:8% 6%;z-index:30;background:#000;border:1px solid #555;box-shadow:0 0 0 9999px rgba(0,0,0,.82);display:flex;flex-direction:column;overflow:hidden}#auditPanel[hidden]{display:none}#auditResult{flex:1;overflow:auto;padding:12px;font:12px/1.5 Consolas,"Courier New",monospace}.audit-head{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.audit-card{border:1px solid #333;margin:8px 0;padding:10px}.audit-title{font-weight:700}.audit-code{white-space:pre-wrap;background:#080808;padding:8px;margin-top:7px}.audit-close{margin-left:auto}@media(max-width:700px){#auditPanel{inset:2% 2%}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <div class="brand">PY-CODE</div>
      <div class="sub">TERMINAL PYTHON • LEVE • COLORIDO • MODO OFFLINE</div>
    </div>
    <div id="status" class="status">PYTHON LOCAL • CARREGANDO...</div>
    <div class="controls">
      <button id="clear" type="button">LIMPAR</button>
      <button id="download" type="button">BAIXAR .PY</button>
      <button id="run" type="button" disabled>EXECUTAR</button>
      <button id="stop" type="button" disabled>PARAR</button>
    </div>
  </div>
</header>

<main>
  <section class="panel">
    <div class="panel-title">
      <span>▸ PROGRAMA.PY</span>
      <span>CTRL + ENTER para executar</span>
    </div>
    <div class="editor-wrap">
      <div id="lines" class="line-numbers" aria-hidden="true">1</div>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">
      <span>▸ TERMINAL</span>
      <span>MODO OFFLINE</span>
    </div>
    <div id="terminal" aria-live="polite"></div>
  </section>

<section id="bot" aria-label="Professor Bot">
  <div id="botHead"><span>PROFESSOR BOT</span><span>OFFLINE</span></div>
  <div id="botMessages" aria-live="polite"></div>
  <div class="bot-actions">
    <button id="botHintBtn" type="button">PEDIR DICA</button>
    <button id="botChallenge" type="button">DESAFIO</button>
  </div>
  <div class="bot-input">
    <input id="botInput" type="text" placeholder="Converse com o professor..." autocomplete="off">
    <button id="botSend" type="button">ENVIAR</button>
  </div>
</section>
<section id="auditPanel" class="panel" hidden><div class="panel-title"><span>▸ AUDITORIA DO CÓDIGO</span><span id="auditSummary">Aguardando análise</span></div><div id="auditResult"></div></section>
</main>

<footer>
  <span>Python executado no navegador com Pyodide</span>
  <span id="version">Py-Code</span>
</footer>

<script>
"use strict";

const $=id=>document.getElementById(id);
const editor=$("code");
const lineNumbers=$("lines");
const terminal=$("terminal");
const run=$("run");
const stop=$("stop");
const status=$("status");
let worker=null;
let ready=false;
let running=false;
let timeoutId=null;

const DEFAULT_CODE=`# Py-Code
# Um terminal simples para aprender Python.

print("================================")
print("        PY-CODE TERMINAL")
print("================================")
print()

nome = "Python"
for numero in range(1, 6):
    print(f"{numero} -> Olá, {nome}!")

print()
print("2 + 3 =", 2 + 3)
print("Programa executado com sucesso.")
`;

function atualizarLinhas(){
  const quantidade=Math.max(1,editor.value.split("\n").length);
  lineNumbers.textContent=Array.from({length:quantidade},(_,i)=>i+1).join("\n");
  lineNumbers.scrollTop=editor.scrollTop;
}
function salvar(){
  try{localStorage.setItem("pycode_codigo",editor.value)}catch(_){}
}

function carregar(){
  try{
    editor.value=localStorage.getItem("pycode_codigo")||DEFAULT_CODE;
  }catch(_){
    editor.value=DEFAULT_CODE;
  }
}

function linha(texto,classe="out"){
  const div=document.createElement("div");
  div.className="line "+classe;
  div.textContent=String(texto);
  terminal.appendChild(div);
  terminal.scrollTop=terminal.scrollHeight;
}

function limparTerminal(){
  terminal.innerHTML="";
}

function mensagemInicial(){
  limparTerminal();
  linha("PY-CODE TERMINAL","info");
  linha("Python no navegador.","meta");
  linha("Digite seu código no editor e pressione EXECUTAR.","meta");
  linha("","meta");
  linha("$ pronto","prompt");
}

function setStatus(texto,classe=""){
  status.textContent=texto;
  status.className="status "+classe;
}

async function novoWorker(){
  if(worker) worker.terminate();

  worker=new Worker("./pycode-worker.js?v=24",{type:"module"});

  worker.onmessage=e=>{
    const m=e.data||{};

    if(m.type==="status"){
      setStatus(m.value);
      return;
    }

    if(m.type==="ready"){
      ready=true;
      run.disabled=false;
      setStatus("PYTHON LOCAL • PRONTO","ok");
      return;
    }

    if(m.type==="stdout"){
      const valor=String(m.value||"");
      valor.split(/\r?\n/).forEach(v=>{
        if(v!=="") linha(v,"out");
      });
      return;
    }

    if(m.type==="stderr"){
      const valor=String(m.value||"");
      valor.split(/\r?\n/).forEach(v=>{
        if(v!=="") linha(v,"err");
      });
      return;
    }

    if(m.type==="done"){
      if(timeoutId)clearTimeout(timeoutId);
      timeoutId=null;
      running=false;
      stop.disabled=true;
      run.disabled=false;
      linha("","meta");
      linha("✓ programa finalizado","ok");
      setStatus("PYTHON PRONTO","ok");
      return;
    }

    if(m.type==="error"||m.type==="fatal"){
      if(timeoutId)clearTimeout(timeoutId);
      timeoutId=null;
      running=false;
      stop.disabled=true;
      run.disabled=false;
      linha(String(m.value||"Erro desconhecido"),"err");
      setStatus("ERRO PYTHON","err");
    }
  };

  worker.onerror=e=>{
    ready=false;
    running=false;
    run.disabled=true;
    stop.disabled=true;
    const detalhe=[e.message,e.filename,e.lineno&&("linha "+e.lineno)].filter(Boolean).join(" • ");
    linha(detalhe||"Falha no Worker","err");
    setStatus("FALHA NO RUNTIME","err");
  };

  worker.onmessageerror=()=>{
    linha("Falha ao receber mensagem do Worker.","err");
    setStatus("ERRO DE COMUNICAÇÃO","err");
  };

  worker.postMessage({type:"boot"});
}

function executar(){
  if(!ready||running)return;

  salvar();
  running=true;
  run.disabled=true;
  stop.disabled=false;

  const codigo=editor.value;
  const usaJogo=/\bdef\s+atualizar\s*\(/.test(codigo)&&/\b(Sprite|criar_sprite|pressionado|cena|mudar_cena|retangulo|circulo|linha|texto|limpar)\b/.test(codigo);

  linha("$ python programa.py","prompt");
  setStatus(usaJogo?"ABRINDO JOGO...":"EXECUTANDO...");

  if(usaJogo){
    abrirJogo(codigo).then(()=>{
      running=false;
      stop.disabled=true;
      run.disabled=false;
      setStatus("JOGO ABERTO","ok");
    }).catch(e=>{
      running=false;
      stop.disabled=true;
      run.disabled=false;
      linha("Falha ao abrir o jogo: "+e.message,"err");
      setStatus("ERRO AO ABRIR JOGO","err");
    });
    return;
  }

  worker.postMessage({type:"run",code:codigo});

  timeoutId=setTimeout(()=>{
    if(running){
      linha("Tempo limite atingido. O processo foi interrompido.","err");
      parar(true);
    }
  },10000);
}

function parar(silencioso=false){
  if(timeoutId)clearTimeout(timeoutId);
  timeoutId=null;

  running=false;
  ready=false;

  if(worker)worker.terminate();
  worker=null;

  stop.disabled=true;
  run.disabled=true;

  if(!silencioso)linha("^C processo interrompido pelo usuário.","warn");

  setStatus("PYTHON LOCAL • REINICIANDO...");
  novoWorker();
}

async function abrirJogo(codigo){
  const largura=window.screen?.availWidth||900;
  const altura=window.screen?.availHeight||700;
  const chave="pycode_game_"+Date.now()+"_"+Math.random().toString(36).slice(2);
  localStorage.setItem(chave,codigo);

  const janela=window.open("./jogo.html#"+encodeURIComponent(chave),"_blank","width="+Math.min(1000,largura)+",height="+Math.min(760,altura));

  if(janela){
    try{janela.opener=null}catch(_){}
    return;
  }

  linha("O navegador bloqueou a nova aba. Clique em EXECUTAR novamente ou permita pop-ups para o Py-Code.","warn");
  throw new Error("Nova aba bloqueada pelo navegador.");
}

editor.addEventListener("input",()=>{salvar();atualizarLinhas();});
editor.addEventListener("scroll",()=>{lineNumbers.scrollTop=editor.scrollTop;});

editor.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){
    e.preventDefault();
    executar();
    return;
  }

  if(e.key==="Tab"){
    e.preventDefault();
    const a=editor.selectionStart;
    const b=editor.selectionEnd;
    editor.setRangeText("    ",a,b,"end");
    salvar();
  }
});

$("clear").onclick=()=>{
  limparTerminal();
  linha("$ terminal limpo","meta");
};

$("run").onclick=executar;
$("stop").onclick=()=>parar(false);

$("download").onclick=()=>{
  const blob=new Blob([editor.value],{type:"text/x-python;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="programa.py";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};


if("serviceWorker" in navigator){
  window.__swReady=navigator.serviceWorker
    .register("./sw.js")
    .catch(e=>{
      linha("Cache offline indisponível: "+String(e&&e.message||e),"warn");
      return null;
    });
}else{
  window.__swReady=Promise.resolve(null);
}

carregar();
atualizarLinhas();
mensagemInicial();
novoWorker();
window.__pyCodeGetCode=()=>editor.value;
</script>
<script src="./code-audit.js?v=1" defer></script>
<script src="./professor-bot.js?v=1" defer></script>
</body>
</html>
