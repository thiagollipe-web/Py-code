<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="Py-Code — Python educativo no navegador, com blocos, HTML e Canvas.">
<meta name="application-name" content="Py-Code">
<link rel="manifest" href="./manifest.webmanifest">
<title>Py-Code | Scratch em Python</title>
<style>
:root{--bg:#000;--panel:#050505;--fg:#00ff66;--muted:#74a98b;--border:#00ff66;--editor:#001407}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:"Courier New",monospace}
body{min-height:100dvh;overflow:hidden;display:flex;flex-direction:column}
button{font:700 13px "Courier New",monospace;color:var(--fg);background:#001a08;border:1px solid var(--border);padding:9px 11px;border-radius:6px;cursor:pointer;min-height:40px}
button:hover{background:#00310f}button:disabled{opacity:.45;cursor:not-allowed}
header{background:var(--panel);border-bottom:2px solid var(--border);padding:9px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-size:20px;font-weight:800;letter-spacing:2px}.status{font-size:12px;color:var(--muted);min-height:18px}
#online{white-space:nowrap}.controls{display:flex;gap:6px;flex-wrap:wrap}
#blocks{background:#020602;border-bottom:1px solid var(--border);padding:8px;max-height:215px;overflow:auto}
#blocks-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;font-size:12px;letter-spacing:1px}
.block-tabs{display:flex;gap:5px;overflow:auto;padding-bottom:6px}
.block-tab{min-height:30px;padding:5px 9px;font-size:11px;flex:0 0 auto}
.block-tab.active{background:#064d1b}
.block-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.code-block{border:0;border-radius:7px;color:#fff;text-align:left;padding:8px 9px;min-height:50px;cursor:grab;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);font:700 12px/1.2 "Courier New",monospace}
.code-block:active{cursor:grabbing}
.code-block small{display:block;margin-top:4px;font-weight:400;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block-mov{background:#146c2e}.block-fis{background:#7a4f10}.block-ctrl{background:#6b2a82}.block-ent{background:#175f78}.block-apa{background:#9a3a16}.block-som{background:#7b1d4b}.block-cen{background:#3f3f3f}.block-pont{background:#8a7200}
main{flex:1 1 auto;height:auto;display:grid;grid-template-rows:minmax(240px,1fr) minmax(220px,.85fr);min-height:0;overflow:hidden}
#editor-container{min-height:0;border-bottom:2px solid var(--border);background:var(--editor);display:flex}
#code{flex:1;width:100%;height:100%;resize:none;border:0;outline:none;padding:12px;background:#001407;color:#00ff66;font:14px/1.5 "Courier New",monospace;tab-size:4;white-space:pre}
#code:focus{box-shadow:inset 0 0 0 1px var(--border)}#code.light-editor{background:#fff;color:#161616}
#display{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,42%);background:#000}
#output{min-width:0;overflow:auto;margin:0;padding:12px;white-space:pre-wrap;word-break:break-word;border-right:1px solid var(--border);font-size:14px;line-height:1.45}
#game{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;background:#020202}
canvas{display:block;width:min(100%,560px);height:auto;max-height:calc(100% - 78px);aspect-ratio:16/9;border:1px dashed var(--border);background:#000;image-rendering:pixelated;touch-action:none}
#touch-controls{display:grid;grid-template-columns:42px 42px 42px 42px 42px;gap:5px;align-items:center;justify-content:center;user-select:none}
#touch-controls .empty{visibility:hidden}.touch{width:42px;height:42px;min-height:42px;padding:0;touch-action:none;-webkit-user-select:none;user-select:none}.touch.action{font-size:12px}
.light{--bg:#f5f5f5;--panel:#fff;--fg:#161616;--muted:#666;--border:#333;--editor:#fff}.light #output,.light #game{background:#fff}
@media(max-width:800px){
 body{overflow:auto}#blocks{max-height:245px}main{height:auto;min-height:calc(100dvh - 380px);grid-template-rows:52dvh 48dvh;overflow:visible;flex:0 0 auto}
 #display{grid-template-columns:1fr;grid-template-rows:1fr minmax(210px,38dvh)}#output{border-right:0;border-bottom:1px solid var(--border)}#game{min-height:210px}
}
@media(max-width:480px){
 #code{font-size:13px;min-height:280px}header{padding:8px}.brand{font-size:17px}.controls{width:100%}button{padding:9px 10px;font-size:12px;flex:1}.top{align-items:flex-start}
 canvas{width:100%;max-height:calc(100% - 72px)}#touch-controls{grid-template-columns:38px 38px 38px 38px 38px;gap:4px}.touch{width:38px;height:38px}
}
</style>
</head>
<body>
<header>
<div class="top">
<div><div class="brand">PY-CODE</div><div id="status" class="status">Inicializando…</div></div>
<div id="online" class="status" aria-live="polite">REDE ● ONLINE</div>
<div class="controls">
<button id="theme-btn" type="button">TEMA: PRETO</button>
<button id="clear-btn" type="button">LIMPAR SAÍDA</button>
<button id="download-btn" type="button">BAIXAR .PY</button>
<button id="run-btn" type="button" disabled>CARREGANDO…</button><button id="stop-btn" type="button" disabled>PARAR</button>
</div>
</div>
</header>

<section id="blocks" aria-label="Blocos do Py-Code">
<div id="blocks-head"><strong>BLOCOS</strong><span>clique ou arraste para o editor</span></div>
<div class="block-tabs" id="block-tabs"></div>
<div class="block-grid" id="block-grid"></div>
</section>

<main>
<section id="editor-container" aria-label="Editor Python">
<textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Código Python"></textarea>
</section>
<section id="display">
<pre id="output" aria-live="polite">Preparando o ambiente Python…</pre>
<div id="game">
<canvas id="canvas" width="320" height="180" aria-label="Tela gráfica"></canvas>
<div id="touch-controls" aria-label="Controles de toque">
<button class="touch empty" tabindex="-1" aria-hidden="true"></button>
<button class="touch" data-key="ArrowUp">▲</button>
<button class="touch empty" tabindex="-1" aria-hidden="true"></button>
<button class="touch action" data-key="x">X</button>
<button class="touch action" data-key="z">Z</button>
<button class="touch" data-key="ArrowLeft">◀</button>
<button class="touch" data-key="ArrowDown">▼</button>
<button class="touch" data-key="ArrowRight">▶</button>
<button class="touch empty" tabindex="-1" aria-hidden="true"></button>
<button class="touch empty" tabindex="-1" aria-hidden="true"></button>
</div>
</div>
</section>
</main>

<script>
"use strict";
const $=id=>document.getElementById(id);
const output=$("output"),status=$("status"),run=$("run-btn"),stop=$("stop-btn");
const themeBtn=$("theme-btn"),clearBtn=$("clear-btn"),dl=$("download-btn"),editor=$("code");
const blockTabs=$("block-tabs"),blockGrid=$("block-grid");
const canvas=$("canvas"),ctx=canvas.getContext("2d");
let worker=null,workerPronto=false,executando=false,jogoAtivo=false,animationId=0,lastFrame=0;
let dark=true,blocoCategoria="Movimento",imagens={},audioContext=null;
window.__pycode_keys=new Set();

const BLOCOS={
Movimento:[
["CRIAR SPRITE","jogador = Sprite(40, 120, 24, 24, \\"#00ff66\\")","block-mov"],
["MOVER","jogador.mover(2, 0)","block-mov"],
["VELOCIDADE","jogador.velocidade(2, 0)","block-mov"]],
Controle:[
["ATUALIZAR JOGO","def atualizar():\\n    limpar(\\"#081018\\")\\n    jogador.desenhar()","block-ctrl"],
["SE TECLA","if pressionado(\\"ArrowRight\\"):\\n    jogador.mover(2, 0)","block-ctrl"],
["REPETIR","for i in range(10):\\n    print(i)","block-ctrl"]],
HTML:[
["STATUS","definir_status(\\"Jogo iniciado!\\")","block-ent"],
["TEXTO HTML","mostrar_texto_html(\\"Olá!\\")","block-ent"]],
Aparência:[
["LIMPAR TELA","limpar(\\"#081018\\")","block-apa"],
["RETÂNGULO","retangulo(100, 60, 30, 30, \\"#00ff66\\")","block-apa"],
["CÍRCULO","circulo(160, 90, 15, \\"#ffcc00\\")","block-apa"],
["TEXTO","texto(\\"Olá!\\", 10, 20)","block-apa"]],
Física:[
["GRAVIDADE","jogador.gravidade(0.5)\\njogador.no_chao(165)","block-fis"],
["PULAR","if pressionado(\\"ArrowUp\\"):\\n    jogador.pular(8)","block-fis"],
["COLISÃO","if jogador.colide(alvo):\\n    somar_pontos(1)","block-fis"]],
Entrada:[
["SE DIREITA","if pressionado(\\"ArrowRight\\"):\\n    jogador.mover(2, 0)","block-ent"],
["SE ESQUERDA","if pressionado(\\"ArrowLeft\\"):\\n    jogador.mover(-2, 0)","block-ent"],
["AÇÃO X","if pressionado(\\"x\\"):\\n    tocar(660, 0.08)","block-ent"]],
Som:[
["TOCAR SOM","tocar(440, 0.12)","block-som"],
["SOM DE PONTO","tocar(880, 0.08)\\nsomar_pontos(1)","block-som"]],
Pontuação:[
["+1 PONTO","somar_pontos(1)","block-pont"],
["ZERAR PONTOS","zerar_pontos()","block-pont"],
["MOSTRAR PONTOS","mostrar_pontos()","block-pont"]],
Cenas:[
["CRIAR CENA","def atualizar_jogo():\\n    limpar(\\"#081018\\")\\n    jogador.desenhar()\\ncena(\\"jogo\\", atualizar=atualizar_jogo)\\nmudar_cena(\\"jogo\\")","block-cen"],
["MUDAR CENA","mudar_cena(\\"jogo\\")","block-cen"],
["NOME DA CENA","print(cena_atual_nome())","block-cen"]
]};

function setOutput(v){output.textContent=String(v==null?"":v)}
function appendOutput(v){const s=String(v==null?"":v);if(s)output.textContent+=(output.textContent?"\n":"")+s}
function appendError(v){const s=String(v==null?"":v);if(s)output.textContent+=(output.textContent?"\n":"")+"ERRO: "+s}
function setStatus(v){status.textContent=String(v)}
function clearCanvas(){ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height)}
function salvar(){localStorage.setItem("pycode_codigo",editor.value)}
function carregar(){
 const salvo=localStorage.getItem("pycode_codigo");
 editor.value=salvo||'# Py-Code — Scratch em Python\n# Python + blocos + Canvas\n\njogador = Sprite(40, 120, 24, 24, "#00ff66")\n\ndef atualizar():\n    limpar("#081018")\n    if pressionado("ArrowRight"):\n        jogador.mover(2, 0)\n    if pressionado("ArrowLeft"):\n        jogador.mover(-2, 0)\n    jogador.limite()\n    jogador.desenhar()\n    mostrar_pontos()\n';
}
function escapar(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function inserirBloco(codigo){
 const a=editor.selectionStart,b=editor.selectionEnd;
 const antes=editor.value.slice(0,a),depois=editor.value.slice(b);
 const prefixo=antes&&!antes.endsWith("\n")?"\n\n":"";
 const sufixo=depois&&!depois.startsWith("\n")?"\n":"";
 editor.value=antes+prefixo+codigo+sufixo+depois;
 const pos=(antes+prefixo+codigo).length;
 editor.focus();editor.setSelectionRange(pos,pos);salvar();
}
function renderBlocos(){
 blockTabs.innerHTML="";blockGrid.innerHTML="";
 Object.keys(BLOCOS).forEach(nome=>{
  const t=document.createElement("button");t.type="button";t.className="block-tab"+(nome===blocoCategoria?" active":"");
  t.textContent=nome;t.onclick=()=>{blocoCategoria=nome;renderBlocos()};blockTabs.appendChild(t);
 });
 BLOCOS[blocoCategoria].forEach(([titulo,codigo,classe])=>{
  const b=document.createElement("button");b.type="button";b.className="code-block "+classe;b.draggable=true;
  b.innerHTML=escapar(titulo)+"<small>"+escapar(codigo.replaceAll("\n"," ↵ "))+"</small>";
  b.onclick=()=>inserirBloco(codigo);
  b.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",codigo));
  blockGrid.appendChild(b);
 });
}
function tocarSom(f,d,t,v){
 try{
  audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==="suspended")audioContext.resume();
  const o=audioContext.createOscillator(),g=audioContext.createGain(),dur=Math.max(.02,Number(d)||.12);
  o.type=t||"square";o.frequency.value=Number(f)||440;g.gain.value=Math.min(.3,Number(v)||.05);
  o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+dur);
 }catch(e){console.warn("Áudio:",e)}
}
function desenharImagem(m){
 const img=imagens[m.url]||(imagens[m.url]=new Image());
 if(!img.src)img.src=m.url;
 if(img.complete)ctx.drawImage(img,m.x,m.y,m.w,m.h);
}
function renderMensagem(m){
 if(m.type==="fill"){ctx.fillStyle=m.color;ctx.fillRect(0,0,canvas.width,canvas.height)}
 else if(m.type==="rect"){ctx.fillStyle=m.color;ctx.fillRect(m.x,m.y,m.w,m.h)}
 else if(m.type==="circle"){ctx.fillStyle=m.color;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill()}
 else if(m.type==="line"){ctx.strokeStyle=m.color;ctx.lineWidth=m.width;ctx.beginPath();ctx.moveTo(m.x1,m.y1);ctx.lineTo(m.x2,m.y2);ctx.stroke()}
 else if(m.type==="text"){ctx.fillStyle=m.color;ctx.font=m.size+"px monospace";ctx.fillText(m.value,m.x,m.y)}
 else if(m.type==="sound")tocarSom(m.frequency,m.duration,m.type,m.volume);
 else if(m.type==="image")desenharImagem(m);
}
function pararLoop(){if(animationId)cancelAnimationFrame(animationId);animationId=0}
function iniciarLoop(){
 pararLoop();lastFrame=performance.now();
 function frame(now){
  if(!jogoAtivo||!workerPronto)return;
  if(now-lastFrame>=33){lastFrame=now;worker.postMessage({type:"keys",keys:[...window.__pycode_keys]});worker.postMessage({type:"frame"})}
  animationId=requestAnimationFrame(frame);
 }
 animationId=requestAnimationFrame(frame);
}
function criarWorker(){
 if(worker)worker.terminate();
 worker=new Worker("./pycode-worker.js");
 worker.onmessage=e=>{
  const m=e.data||{};
  if(m.type==="status"){setStatus(m.value);return}
  if(m.type==="ready"){workerPronto=true;run.disabled=false;run.textContent="EXECUTAR";setStatus("Python pronto");return}
  if(m.type==="stdout"){appendOutput(m.value);return}
  if(m.type==="stderr"){appendError(m.value);return}
  if(["fill","rect","circle","line","text","sound","image"].includes(m.type)){renderMensagem(m);return}
  if(m.type==="done"){executando=false;jogoAtivo=true;run.disabled=false;stop.disabled=false;run.textContent="EXECUTAR";appendOutput("✓ Execução concluída");iniciarLoop();return}
  if(m.type==="error"||m.type==="fatal"){executando=false;jogoAtivo=false;stop.disabled=true;run.disabled=false;run.textContent="EXECUTAR";pararLoop();appendError(m.value);setStatus("Erro Python")}
 };
 worker.onerror=e=>{executando=false;jogoAtivo=false;workerPronto=false;pararLoop();stop.disabled=true;run.disabled=true;appendError(e.message||"Falha no Worker");setStatus("Falha no runtime")};
 worker.postMessage({type:"boot"});
}
function executar(){
 if(!workerPronto||executando)return;
 salvar();clearCanvas();setOutput("");window.__pycode_keys.clear();
 executando=true;jogoAtivo=false;run.disabled=true;stop.disabled=false;run.textContent="EXECUTANDO…";setStatus("Executando Python…");
 worker.postMessage({type:"keys",keys:[]});worker.postMessage({type:"run",code:editor.value});
}
function parar(){
 jogoAtivo=false;pararLoop();window.__pycode_keys.clear();
 if(worker)worker.terminate();worker=null;workerPronto=false;executando=false;stop.disabled=true;
 appendOutput("Execução interrompida pelo usuário.");setStatus("Execução parada");run.disabled=true;run.textContent="CARREGANDO…";criarWorker();
}
function atualizarRede(){$("online").textContent=navigator.onLine?"REDE ● ONLINE":"REDE ● OFFLINE"}

editor.addEventListener("input",salvar);
editor.addEventListener("keydown",e=>{
 if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();executar()}
 if(e.key==="Tab"){e.preventDefault();const a=editor.selectionStart,b=editor.selectionEnd;editor.setRangeText("    ",a,b,"end");salvar()}
});
editor.addEventListener("dragover",e=>e.preventDefault());
editor.addEventListener("drop",e=>{e.preventDefault();const c=e.dataTransfer.getData("text/plain");if(c)inserirBloco(c)});
addEventListener("keydown",e=>{if(document.activeElement===editor)return;window.__pycode_keys.add(e.key);window.__pycode_keys.add(e.key.toLowerCase())});
addEventListener("keyup",e=>{if(document.activeElement===editor)return;window.__pycode_keys.delete(e.key);window.__pycode_keys.delete(e.key.toLowerCase())});
addEventListener("blur",()=>window.__pycode_keys.clear());

document.querySelectorAll(".touch").forEach(btn=>{
 const key=btn.dataset.key;if(!key)return;
 const down=e=>{e.preventDefault();window.__pycode_keys.add(key);btn.setPointerCapture?.(e.pointerId)};
 const up=e=>{e.preventDefault();window.__pycode_keys.delete(key)};
 btn.addEventListener("pointerdown",down);
 ["pointerup","pointercancel","lostpointercapture"].forEach(x=>btn.addEventListener(x,up));
});

themeBtn.onclick=()=>{dark=!dark;document.body.classList.toggle("light",!dark);editor.classList.toggle("light-editor",!dark);themeBtn.textContent=dark?"TEMA: PRETO":"TEMA: CLARO"};
clearBtn.onclick=()=>{setOutput("");clearCanvas()};
dl.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([editor.value],{type:"text/x-python"}));a.download="programa.py";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
run.onclick=executar;
stop.onclick=parar;
addEventListener("online",atualizarRede);addEventListener("offline",atualizarRede);
addEventListener("error",e=>{if(e.message)appendError("NAVEGADOR: "+e.message)});
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
renderBlocos();carregar();clearCanvas();atualizarRede();criarWorker();
</script>
</body>
</html>
