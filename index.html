<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="Py-Code — editor Python executado no navegador com Pyodide.">
<meta name="application-name" content="Py-Code">
<link rel="manifest" href="./manifest.webmanifest">
<title>Py-Code | Python no navegador</title>
<style>
:root{--bg:#000;--panel:#050505;--fg:#00ff66;--muted:#74a98b;--border:#00ff66;--editor:#001407}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:"Courier New",monospace}
body{min-height:100dvh;overflow:hidden}
button{font:700 14px "Courier New",monospace;color:var(--fg);background:#001a08;border:1px solid var(--border);padding:10px 12px;border-radius:6px;cursor:pointer;min-height:42px}
button:hover{background:#00310f}button:disabled{opacity:.45;cursor:not-allowed}
header{background:var(--panel);border-bottom:2px solid var(--border);padding:10px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-size:20px;font-weight:800;letter-spacing:2px}.status{font-size:12px;color:var(--muted);min-height:18px}
#online{white-space:nowrap}
.controls{display:flex;gap:8px;flex-wrap:wrap}
main{height:calc(100dvh - 89px);display:grid;grid-template-rows:minmax(260px,1fr) minmax(220px,.85fr);min-height:0}
#code:focus{box-shadow:inset 0 0 0 1px var(--border)}
#editor-container{min-height:0;border-bottom:2px solid var(--border);background:var(--editor);display:flex;flex-direction:column}
#editor-toolbar{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--border);font-size:11px}
#editor-toolbar select{min-height:34px;background:#000;color:var(--fg);border:1px solid var(--border);border-radius:5px;font:inherit;padding:5px 8px}
#code{flex:1;width:100%;resize:none;border:0;outline:none;padding:12px;background:#001407;color:#00ff66;font:14px/1.5 "Courier New",monospace;tab-size:4;white-space:pre}
#code.light-editor{background:#fff;color:#161616}
#display{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,42%);background:#000}
#output{min-width:0;overflow:auto;padding:12px;white-space:pre-wrap;word-break:break-word;border-right:1px solid var(--border);font-size:14px;line-height:1.45}
#game{min-width:0;display:flex;align-items:center;justify-content:center;padding:10px;background:#020202}
canvas{display:block;width:min(100%,500px);height:auto;max-height:100%;aspect-ratio:1;border:1px dashed var(--border);background:#000;image-rendering:pixelated}
.cm-editor{height:100%!important;font-size:14px}
.light{--bg:#f5f5f5;--panel:#fff;--fg:#161616;--muted:#666;--border:#333;--editor:#fff}
.light #output,.light #game{background:#fff}
@media (max-width:800px){
 body{overflow:auto}main{height:auto;min-height:calc(100dvh - 120px);grid-template-rows:52dvh 48dvh}
 #display{grid-template-columns:1fr;grid-template-rows:1fr minmax(180px,36dvh)}
 #output{border-right:0;border-bottom:1px solid var(--border)}#game{min-height:180px}
}
@media (max-width:480px){
 #editor-toolbar{flex-wrap:wrap}#code{font-size:13px;min-height:280px}
 header{padding:8px}.brand{font-size:17px}.controls{width:100%}
 button{padding:9px 10px;font-size:12px;flex:1}.top{align-items:flex-start}
}
</style>
</head>
<body>
<header><div class="top">
<div><div class="brand">PY-CODE</div><div id="status" class="status">Inicializando editor…</div></div>
<div id="online" class="status" aria-live="polite">● ONLINE</div>
<div class="controls">
<button id="theme-btn" type="button">TEMA: PRETO</button>
<button id="clear-btn" type="button">LIMPAR</button>
<button id="download-btn" type="button">BAIXAR .PY</button>
<button id="run-btn" type="button" disabled>CARREGANDO…</button>
</div></div></header>
<main>
<section id="editor-container" aria-label="Editor Python">
  <div id="editor-toolbar">
    <label for="example-select">EXEMPLO</label>
    <select id="example-select"><option value="">— escolher —</option></select>
  </div>
  <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Código Python"></textarea>
</section>
<section id="display"><pre id="output" aria-live="polite">Preparando o ambiente Python…</pre>
<div id="game"><canvas id="canvas" width="300" height="300" aria-label="Tela gráfica"></canvas></div></section>
</main>
<script src="https://cdn.jsdelivr.net/pyodide/v0.28.2/full/pyodide.js"></script>
<script>

const $=id=>document.getElementById(id);
const output=$("output"),status=$("status"),run=$("run-btn"),themeBtn=$("theme-btn"),
      clearBtn=$("clear-btn"),dl=$("download-btn"),example=$("example-select"),editor=$("code");
const canvas=$("canvas"),ctx=canvas.getContext("2d");
let pyodide=null,dark=true,executando=false;

const EXEMPLOS={"Olá mundo":"print(\"Olá, Py-Code!\")","Desenho":"from js import document\\ncanvas = document.getElementById(\"canvas\")\\nctx = canvas.getContext(\"2d\")\\nctx.fillStyle = \"#00ff66\"\\nctx.fillRect(70, 70, 160, 160)","Pong simples":"import random\\nprint(\"PONG\")\\nprint(\"Use este exemplo para testar Python no navegador.\")","Laço":"for i in range(1, 11):\\n    print(\"Número:\", i)"};

function setOutput(t){output.textContent=String(t??"")}
function setStatus(t){status.textContent=t}
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height)}
function salvar(){localStorage.setItem("pycode_codigo",editor.value)}
function carregar(){const s=localStorage.getItem("pycode_codigo");editor.value=s??"# Bem-vindo ao Py-Code\nprint(\"Olá, Py-Code!\")\n\n# Experimente:\nfor i in range(5):\n    print(\"Número:\", i)\n"}
function resetarCodigo(){editor.value="# Bem-vindo ao Py-Code\nprint(\"Olá, Py-Code!\")\n\n# Experimente:\nfor i in range(5):\n    print(\"Número:\", i)\n";salvar()}

function iniciarExemplos(){
  Object.keys(EXEMPLOS).forEach(nome=>{
    const o=document.createElement("option");o.value=nome;o.textContent=nome;example.appendChild(o);
  });
}
example.onchange=()=>{if(EXEMPLOS[example.value]){editor.value=EXEMPLOS[example.value];salvar();setOutput("Exemplo carregado: "+example.value)}};
editor.addEventListener("input",salvar);
editor.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();if(!run.disabled)run.click()}
});

themeBtn.onclick=()=>{
  dark=!dark;
  document.body.classList.toggle("light",!dark);
  themeBtn.textContent=dark?"TEMA: PRETO":"TEMA: CLARO";
  editor.classList.toggle("light-editor",!dark);
};

clearBtn.onclick=()=>{setOutput("");clearCanvas();};
dl.onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([editor.value],{type:"text/x-python;charset=utf-8"}));
  a.download="programa.py";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

async function carregarPython(){
  setStatus("Carregando Python…");
  setOutput("PY-CODE\n\nBaixando o ambiente Python…");
  try{
    for(let i=0;i<100 && typeof loadPyodide!=="function";i++) await new Promise(r=>setTimeout(r,100));
    if(typeof loadPyodide!=="function") throw new Error("O carregador do Python não foi encontrado.");
    pyodide=await loadPyodide({
      indexURL:"https://cdn.jsdelivr.net/pyodide/v0.28.2/full/",
      stdout:s=>{output.textContent+=(output.textContent?"\n":"")+s},
      stderr:s=>{output.textContent+=(output.textContent?"\n":"")+s}
    });
    setOutput("PY-CODE ONLINE\nPython pronto.");
    setStatus("Python pronto");
    run.disabled=false;
    run.textContent="EXECUTAR";
  }catch(e){
    console.error(e);
    setOutput("NÃO FOI POSSÍVEL INICIAR O PYTHON\n\n"+String(e));
    setStatus("Falha ao carregar Python");
  }
}

run.onclick=async()=>{
  if(!pyodide||executando)return;
  executando=true;run.disabled=true;run.textContent="EXECUTANDO…";
  setOutput("");
  clearCanvas();
  try{
    salvar();
    await pyodide.runPythonAsync(editor.value);
    output.textContent+=(output.textContent?"\n\n":"")+"OK";
  }catch(e){
    console.error(e);
    output.textContent+=(output.textContent?"\n\n":"")+"ERRO:\n"+String(e);
  }finally{
    executando=false;run.disabled=false;run.textContent="EXECUTAR";
  }
};

window.addEventListener("error",e=>{
  if(e?.message){setStatus("Erro no navegador");output.textContent+="\n\nERRO DO NAVEGADOR:\n"+e.message}
});
window.addEventListener("unhandledrejection",e=>{
  const r=String(e?.reason??"Erro assíncrono");
  setStatus("Erro assíncrono");output.textContent+="\n\nERRO ASSÍNCRONO:\n"+r
});

const online=$("online");
function atualizarRede(){online.textContent=navigator.onLine?"● ONLINE":"● OFFLINE";setStatus(navigator.onLine?status.textContent:"Sem internet");}
addEventListener("online",atualizarRede);addEventListener("offline",atualizarRede);
atualizarRede();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
carregar();iniciarExemplos();clearCanvas();carregarPython();

</script></body></html>
