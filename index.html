<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="Py-Code — Python educativo no navegador, com blocos, HTML e Canvas.">
<meta name="application-name" content="Py-Code">
<link rel="manifest" href="./manifest.webmanifest">
<title>Py-Code | Scratch em Python</title>
<style>
:root{--bg:#000;--panel:#050505;--fg:#00ff66;--muted:#74a98b;--border:#00ff66;--editor:#001407}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:"Courier New",monospace}
body{min-height:100dvh;overflow:hidden;display:flex;flex-direction:column}
button{font:700 13px "Courier New",monospace;color:var(--fg);background:#001a08;border:1px solid var(--border);padding:9px 11px;border-radius:6px;cursor:pointer;min-height:40px}
button:hover{background:#00310f}button:disabled{opacity:.45;cursor:not-allowed}
header{background:var(--panel);border-bottom:2px solid var(--border);padding:9px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-size:20px;font-weight:800;letter-spacing:2px}.status{font-size:12px;color:var(--muted);min-height:18px}
#online{white-space:nowrap}.controls{display:flex;gap:6px;flex-wrap:wrap}
#blocks{background:#020602;border-bottom:1px solid var(--border);padding:8px;max-height:215px;overflow:auto}
#blocks-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;font-size:12px;letter-spacing:1px}
.block-tabs{display:flex;gap:5px;overflow:auto;padding-bottom:6px}
.block-tab{min-height:30px;padding:5px 9px;font-size:11px;flex:0 0 auto}
.block-tab.active{background:#064d1b}
.block-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.code-block{border:0;border-radius:7px;color:#fff;text-align:left;padding:8px 9px;min-height:50px;cursor:grab;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);font:700 12px/1.2 "Courier New",monospace}
.code-block:active{cursor:grabbing}
.code-block small{display:block;margin-top:4px;font-weight:400;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block-mov{background:#146c2e}.block-fis{background:#7a4f10}.block-ctrl{background:#6b2a82}.block-ent{background:#175f78}.block-apa{background:#9a3a16}.block-som{background:#7b1d4b}.block-cen{background:#3f3f3f}.block-pont{background:#8a7200}
main{flex:1 1 auto;height:auto;display:grid;grid-template-rows:minmax(240px,1fr) minmax(220px,.85fr);min-height:0;overflow:hidden}
#editor-container{min-height:0;border-bottom:2px solid var(--border);background:var(--editor);display:flex}
#code{flex:1;width:100%;height:100%;resize:none;border:0;outline:none;padding:12px;background:#001407;color:#00ff66;font:14px/1.5 "Courier New",monospace;tab-size:4;white-space:pre}
#code:focus{box-shadow:inset 0 0 0 1px var(--border)}#code.light-editor{background:#fff;color:#161616}
#display{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,42%);background:#000}
#output{min-width:0;overflow:auto;margin:0;padding:12px;white-space:pre-wrap;word-break:break-word;border-right:1px solid var(--border);font-size:14px;line-height:1.45}
#game{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;background:#020202}
canvas{display:block;width:min(100%,560px);height:auto;max-height:calc(100% - 78px);aspect-ratio:16/9;border:1px dashed var(--border);background:#000;image-rendering:pixelated;touch-action:none}
#touch-controls{display:grid;grid-template-columns:42px 42px 42px 42px 42px;gap:5px;align-items:center;justify-content:center;user-select:none}
#touch-controls .empty{visibility:hidden}.touch{width:42px;height:42px;min-height:42px;padding:0;touch-action:none;-webkit-user-select:none;user-select:none}.touch.action{font-size:12px}
.light{--bg:#f5f5f5;--panel:#fff;--fg:#161616;--muted:#666;--border:#333;--editor:#fff}.light #output,.light #game{background:#fff}
@media(max-width:800px){
 body{overflow:auto}#blocks{max-height:245px}main{height:auto;min-height:calc(100dvh - 380px);grid-template-rows:52dvh 48dvh;overflow:visible;flex:0 0 auto}
 #display{grid-template-columns:1fr;grid-template-rows:1fr minmax(210px,38dvh)}#output{border-right:0;border-bottom:1px solid var(--border)}#game{min-height:210px}
}
@media(max-width:480px){
 #code{font-size:13px;min-height:280px}header{padding:8px}.brand{font-size:17px}.controls{width:100%}button{padding:9px 10px;font-size:12px;flex:1}.top{align-items:flex-start}
 canvas{width:100%;max-height:calc(100% - 72px)}#touch-controls{grid-template-columns:38px 38px 38px 38px 38px;gap:4px}.touch{width:38px;height:38px}
}

<body>
<header>
<div class="top">
<div><div class="brand">PY-CODE</div><div id="status" class="status">Inicializando…</div></div>
<div id="online" class="status" aria-live="polite">REDE ● ONLINE</div>
<div class="controls">
<button id="theme-btn" type="button">TEMA: PRETO</button>
<button id="clear-btn" type="button">LIMPAR SAÍDA</button>

<main>
<section id="editor-container" aria-label="Editor Python">

</section>

<div id="touch-controls" aria-label="Controles de toque">

<button class="touch" data-key="ArrowUp">▲</button>
<button class="touch empty" tabindex="-1" aria-hidden="true"></button>
<button class="touch action" data-key="x">X</button>

<button class="touch empty" tabindex="-1" aria-hidden="true"></button>
</div>
</div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const output=$("output"),status=$("status"),run=$("run-btn"),themeBtn=$("theme-btn"),
      clearBtn=$("clear-btn"),dl=$("download-btn"),editor=$("code"),
      blockTabs=$("block-tabs"),blockGrid=$("block-grid");
const canvas=$("canvas"),ctx=canvas.getContext("2d");

let worker=null,dark=true,executando=false,animationId=0,frameEmExecucao=false,workerPronto=false,jogoAtivo=false;\nconst stop=$("stop-btn");

window.__pycode_keys=new Set();
window.pycode_pressed=key=>{
  const k=String(key);
  return window.__pycode_keys.has(k)||window.__pycode_keys.has(k.toLowerCase());
};
window.pycode_image=url=>{const image=new Image();image.src=String(url);return image};

let audioContext=null;
window.pycode_sound=(frequency,duration,type,volume)=>{
  try{
    audioContext??=new (window.AudioContext||window.webkitAudioContext)();
    if(audioContext.state==="suspended")audioContext.resume();
    const osc=audioContext.createOscillator(),gain=audioContext.createGain();
    const v=Math.max(0.0001,Math.min(0.3,Number(volume)||0.05));
    const d=Math.max(0.02,Number(duration)||0.12);
    osc.type=type||"square";osc.frequency.value=Number(frequency)||440;
    gain.gain.setValueAtTime(v,audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001,audioContext.currentTime+d);
    osc.connect(gain);gain.connect(audioContext.destination);
    osc.start();osc.stop(audioContext.currentTime+d);
  }catch(_){}
};

function teclaDown(key){window.__pycode_keys.add(String(key))}
function teclaUp(key){window.__pycode_keys.delete(String(key))}
addEventListener("keydown",e=>{if(document.activeElement===editor)return;teclaDown(e.key);teclaDown(e.key.toLowerCase())});
addEventListener("keyup",e=>{if(document.activeElement===editor)return;teclaUp(e.key);teclaUp(e.key.toLowerCase())});
addEventListener("blur",()=>window.__pycode_keys.clear());

document.querySelectorAll(".touch").forEach(btn=>{
  const key=btn.dataset.key;if(!key)return;
  const down=e=>{e.preventDefault();teclaDown(key);btn.setPointerCapture?.(e.pointerId)};
  const up=e=>{e.preventDefault();teclaUp(key)};
  ["pointerup","pointercancel","lostpointercapture"].forEach(type=>btn.addEventListener(type,up));
  btn.addEventListener("pointerdown",down);
});

function setOutput(t){output.textContent=String(t??"")}
function appendOutput(value){const text=String(value??"");if(!text)return;output.textContent+=(output.textContent?"\
":"")+text}
function appendErrorOutput(value){const text=String(value??"");if(!text)return;output.textContent+=(output.textContent?"\
":"")+"ERRO: "+text}
function setStatus(t){status.textContent=t}
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height)}
function salvar(){localStorage.setItem("pycode_codigo",editor.value)}
function carregar(){
  const salvo=localStorage.getItem("pycode_codigo");
  editor.value=salvo??`# Py-Code — Scratch em Python
# Blocos, Python e Canvas.

jogador = Sprite(40, 120, 24, 24, "#00ff66")

def atualizar():
    limpar("#081018")

    if pressionado("ArrowRight"):
        jogador.mover(2, 0)
    if pressionado("ArrowLeft"):
        jogador.mover(-2, 0)

    jogador.limite()
    jogador.desenhar()
    mostrar_pontos()
`;
}

const BLOCOS={
  "Movimento":[
    ["CRIAR SPRITE",`jogador = Sprite(40, 120, 24, 24, "#00ff66")`,"block-mov"],
    ["MOVER",`jogador.mover(2, 0)`,"block-mov"],
    ["VELOCIDADE",`jogador.velocidade(2, 0)`,"block-mov"]
  ],
  "Controle":[
    ["ATUALIZAR JOGO",`def atualizar():
    limpar("#081018")
    jogador.desenhar()`,"block-ctrl"],
    ["SE TECLA",`if pressionado("ArrowRight"):
    jogador.mover(2, 0)`,"block-ctrl"],
    ["REPETIR",`for i in range(10):
    print(i)`,"block-ctrl"]
  ],
  "HTML":[
    ["PEGAR CANVAS",`elemento = document.getElementById("canvas")`,"block-ent"],
    ["MUDAR STATUS",`document.getElementById("status").textContent = "Jogo iniciado!"`,"block-ent"]
  ],
  "Aparência":[
    ["LIMPAR TELA",`limpar("#081018")`,"block-apa"],
    ["RETÂNGULO",`retangulo(100, 60, 30, 30, "#00ff66")`,"block-apa"],
    ["CÍRCULO",`circulo(160, 90, 15, "#ffcc00")`,"block-apa"],
    ["TEXTO",`texto("Olá!", 10, 20)`,"block-apa"]
  ],
  "Física":[
    ["GRAVIDADE",`jogador.gravidade(0.5)
jogador.no_chao(165)`,"block-fis"],
    ["PULAR",`jogador.no_chao(165)
if pressionado("ArrowUp"):
    jogador.pular(8)`,"block-fis"],
    ["COLISÃO",`alvo = Sprite(220, 120, 24, 24, "#ff3333")
if jogador.colide(alvo):
    somar_pontos(1)`,"block-fis"]
  ],
  "Entrada":[
    ["SE DIREITA",`if pressionado("ArrowRight"):
    jogador.mover(2, 0)`,"block-ent"],
    ["SE ESQUERDA",`if pressionado("ArrowLeft"):
    jogador.mover(-2, 0)`,"block-ent"],
    ["SE AÇÃO X",`if pressionado("x"):
    tocar(660, 0.08)`,"block-ent"]
  ],
  "Som":[
    ["TOCAR SOM",`tocar(440, 0.12)`,"block-som"],
    ["SOM DE PONTO",`tocar(880, 0.08)
somar_pontos(1)`,"block-som"]
  ],
  "Pontuação":[
    ["+1 PONTO",`somar_pontos(1)`,"block-pont"],
    ["ZERAR PONTOS",`zerar_pontos()`,"block-pont"],
    ["MOSTRAR PONTOS",`mostrar_pontos()`,"block-pont"]
  ],
  "Cenas":[
    ["CRIAR CENA",`def atualizar_jogo():
    limpar("#081018")
    if "jogador" in globals():
        jogador.desenhar()

cena("jogo", atualizar=atualizar_jogo)
mudar_cena("jogo")`,"block-cen"],
    ["MUDAR CENA",`mudar_cena("jogo")`,"block-cen"],
    ["NOME DA CENA",`print(cena_atual_nome())`,"block-cen"]
  ]
};

let blocoCategoria="Movimento";

function escaparHtml(valor){
  return String(valor).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}
function inserirBloco(codigo){
  const inicio=editor.selectionStart,fim=editor.selectionEnd;
  const antes=editor.value.slice(0,inicio),depois=editor.value.slice(fim);
  const prefixo=antes&&!antes.endsWith("
")?"

":"";
  const sufixo=depois&&!depois.startsWith("
")?"
":"";
  editor.value=antes+prefixo+codigo+sufixo+depois;
  const pos=(antes+prefixo+codigo).length;
  editor.focus();editor.setSelectionRange(pos,pos);salvar();
}
function renderBlocos(){
  blockTabs.innerHTML="";blockGrid.innerHTML="";
  Object.keys(BLOCOS).forEach(nome=>{
    const tab=document.createElement("button");
    tab.type="button";tab.className="block-tab"+(nome===blocoCategoria?" active":"");
    tab.textContent=nome;tab.onclick=()=>{blocoCategoria=nome;renderBlocos()};
    blockTabs.appendChild(tab);
  });
  BLOCOS[blocoCategoria].forEach(([titulo,codigo,classe])=>{
    const b=document.createElement("button");
    b.type="button";b.draggable=true;b.className="code-block "+classe;
    b.innerHTML=escaparHtml(titulo)+"<small>"+escaparHtml(codigo.replaceAll("
"," ↵ "))+"</small>";
    b.title="Inserir bloco Python";
    b.onclick=()=>inserirBloco(codigo);
    b.addEventListener("dragstart",e=>{
      e.dataTransfer.setData("text/plain",codigo);
      e.dataTransfer.effectAllowed="copy";
    });
    blockGrid.appendChild(b);
  });
}
editor.addEventListener("dragover",e=>{e.preventDefault();e.dataTransfer.dropEffect="copy"});
editor.addEventListener("drop",e=>{
  e.preventDefault();
  const codigo=e.dataTransfer.getData("text/plain");
  if(!codigo)return;
  inserirBloco(codigo);
});
renderBlocos();

editor.addEventListener("input",salvar);
editor.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();if(!run.disabled)run.click()}
});

themeBtn.onclick=()=>{
  dark=!dark;document.body.classList.toggle("light",!dark);
  themeBtn.textContent=dark?"TEMA: PRETO":"TEMA: CLARO";
  editor.classList.toggle("light-editor",!dark);
};
clearBtn.onclick=()=>{setOutput("");clearCanvas()};
dl.onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([editor.value],{type:"text/x-python;charset=utf-8"}));
  a.download="programa.py";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

function appendOutput(value){const text=String(value??"");if(!text)return;output.textContent+=(output.textContent?"\n":"")+text}
function appendErrorOutput(value){const text=String(value??"");if(!text)return;output.textContent+=(output.textContent?"\n":"")+"ERRO: "+text}
function setStatus(t){status.textContent=t}
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height)}
function salvar(){localStorage.setItem("pycode_codigo",editor.value)}
function carregar(){
  const salvo=localStorage.getItem("pycode_codigo");
  editor.value=salvo??\`# Py-Code — Scratch em Python
# Blocos, Python e Canvas.

jogador = Sprite(40, 120, 24, 24, "#00ff66")

def atualizar():
    limpar("#081018")
    if pressionado("ArrowRight"):
        jogador.mover(2, 0)
    if pressionado("ArrowLeft"):
        jogador.mover(-2, 0)
    jogador.limite()
    jogador.desenhar()
    mostrar_pontos()
\`;
}

function iniciarWorker(){
  if(worker){worker.terminate();worker=null}
  workerPronto=false;executando=false;jogoAtivo=false;
  stop.disabled=true;run.disabled=true;run.textContent="CARREGANDO…";
  setStatus("Inicializando Python…");setOutput("PY-CODE\n\nCarregando runtime Python isolado…");
  worker=new Worker("./pycode-worker.js");
  worker.onmessage=evento=>{
    const m=evento.data||{};
    if(m.type==="status"){setStatus(m.value);return}
    if(m.type==="ready"){
      workerPronto=true;run.disabled=false;run.textContent="EXECUTAR";setStatus("Python pronto");appendOutput("Python + blocos + Canvas prontos.");return
    }
    if(m.type==="stdout"){appendOutput(m.value);return}
    if(m.type==="stderr"){appendErrorOutput(m.value);return}
    if(m.type==="fill"){ctx.fillStyle=m.color;ctx.fillRect(0,0,canvas.width,canvas.height);return}
    if(m.type==="rect"){ctx.fillStyle=m.color;ctx.fillRect(m.x,m.y,m.w,m.h);return}
    if(m.type==="circle"){ctx.fillStyle=m.color;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill();return}
    if(m.type==="line"){ctx.strokeStyle=m.color;ctx.lineWidth=m.width;ctx.beginPath();ctx.moveTo(m.x1,m.y1);ctx.lineTo(m.x2,m.y2);ctx.stroke();return}
    if(m.type==="text"){ctx.fillStyle=m.color;ctx.font=m.size+"px monospace";ctx.fillText(m.value,m.x,m.y);return}
    if(m.type==="sound"){tocarSom(m.frequency,m.duration,m.type,m.volume);return}
    if(m.type==="image"){desenharImagem(m);return}
    if(m.type==="done"){appendOutput("✓ Execução concluída");jogoAtivo=true;stop.disabled=false;executando=false;run.disabled=false;run.textContent="EXECUTAR";iniciarLoop();return}
    if(m.type==="error"||m.type==="fatal"){appendErrorOutput(m.value);setStatus("Erro Python");executando=false;jogoAtivo=false;stop.disabled=true;run.disabled=false;run.textContent="EXECUTAR";pararLoop();return}
  };
  worker.onerror=e=>{appendErrorOutput(e.message||"Falha no Worker Python");setStatus("Falha no runtime");executando=false;jogoAtivo=false;stop.disabled=true;run.disabled=!workerPronto;pararLoop()};
  worker.postMessage({type:"boot"});
}
let imagens={};
function desenharImagem(m){
  const key=m.url;
  let img=imagens[key];
  if(!img){img=new Image();img.onload=()=>{ctx.drawImage(img,m.x,m.y,m.w,m.h)};img.src=key;imagens[key]=img}
  if(img.complete)ctx.drawImage(img,m.x,m.y,m.w,m.h)
}
let audioContext=null;
function tocarSom(frequency,duration,type,volume){
  try{
    audioContext??=new (window.AudioContext||window.webkitAudioContext)();
    if(audioContext.state==="suspended")audioContext.resume();
    const osc=audioContext.createOscillator(),gain=audioContext.createGain(),d=Math.max(.02,Number(duration)||.12),v=Math.max(.0001,Math.min(.3,Number(volume)||.05));
    osc.type=type||"square";osc.frequency.value=Number(frequency)||440;gain.gain.setValueAtTime(v,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+d);
    osc.connect(gain);gain.connect(audioContext.destination);osc.start();osc.stop(audioContext.currentTime+d);
  }catch(e){console.warn("Áudio:",e)}
}
function pararLoop(){if(animationId)cancelAnimationFrame(animationId);animationId=0;frameEmExecucao=false}
function iniciarLoop(){
  pararLoop();
  let ultimo=performance.now();
  const frame=agora=>{
    if(!jogoAtivo||!workerPronto)return;
    const dt=agora-ultimo;
    if(dt>=33&&!frameEmExecucao){
      ultimo=agora;frameEmExecucao=true;
      worker.postMessage({type:"keys",keys:[...window.__pycode_keys]});
      worker.postMessage({type:"frame"});
    }
    animationId=requestAnimationFrame(t=>{
      frameEmExecucao=false;frame(t)
    });
  };
  animationId=requestAnimationFrame(frame);
}
function pararExecucao(mensagem="Execução interrompida pelo usuário."){
  jogoAtivo=false;pararLoop();window.__pycode_keys.clear();
  if(worker){worker.terminate();worker=null}
  workerPronto=false;executando=false;stop.disabled=true;run.disabled=true;run.textContent="CARREGANDO…";
  appendOutput(mensagem);setStatus("Execução parada");iniciarWorker();
}
function executar(){
  if(!workerPronto||executando)return;
  executando=true;jogoAtivo=false;pararLoop();window.__pycode_keys.clear();clearCanvas();setOutput("");
  stop.disabled=false;run.disabled=true;run.textContent="EXECUTANDO…";setStatus("Executando Python…");
  worker.postMessage({type:"keys",keys:[]});
  worker.postMessage({type:"run",code:editor.value});
}
run.onclick=executar;
stop.onclick=()=>pararExecucao();
clearBtn.onclick=()=>{setOutput("");clearCanvas()};
dl.onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([editor.value],{type:"text/x-python;charset=utf-8"}));
  a.download="programa.py";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

window.addEventListener("error",e=>{
  if(e?.message){setStatus("Erro no navegador");output.textContent+="

ERRO DO NAVEGADOR:
"+e.message}
});
window.addEventListener("unhandledrejection",e=>{
  const r=String(e?.reason??"Erro assíncrono");setStatus("Erro assíncrono");output.textContent+="

ERRO ASSÍNCRONO:
"+r
});
const online=$("online");
function atualizarRede(){online.textContent=navigator.onLine?"REDE ● ONLINE":"REDE ● OFFLINE"}
addEventListener("online",atualizarRede);addEventListener("offline",atualizarRede);atualizarRede();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
carregar();clearCanvas();carregarPython();
</script>
</body>
</html>
