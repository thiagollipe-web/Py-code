<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050805">
<title>Py-Code :: Professor Python</title>
<style>
:root{--bg:#080808;--panel:#080c08;--line:#173017;--green:#49ff72;--dim:#6ba978;--cyan:#58e7ff;--yellow:#ffe66d;--red:#ff6262}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020402;color:var(--green);font-family:"Courier New",Consolas,monospace}
body{padding:0}.terminal{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0,#0a160b 0,#080808 45%,#020402 100%)}
.header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:#0b0b0b;box-shadow:0 2px 18px #000}
.title{font-weight:700;letter-spacing:1px}.status{font-size:11px;color:var(--dim)}
.screen{width:min(1100px,100%);margin:0 auto;flex:1;display:flex;flex-direction:column;padding:18px 16px 10px}
#output{flex:1;overflow:auto;white-space:pre-wrap;word-break:break-word;line-height:1.55;font-size:14px;padding-bottom:8px}
.line{margin:0 0 5px}.bot{color:var(--green)}.user{color:var(--cyan)}.system{color:var(--dim)}.warn{color:var(--yellow)}.error{color:var(--red)}
.menu{margin:7px 0 15px;padding-left:18px;color:#b7ffc3}
.menu button{display:block;width:100%;max-width:760px;text-align:left;margin:5px 0;padding:7px 9px;background:#0b0b0b;color:var(--green);border:1px solid #1d481f;font:inherit;cursor:pointer}
.menu button:hover,.menu button:focus{background:#0c1d0d;border-color:var(--green);outline:none}
.prompt{display:flex;align-items:center;border-top:1px solid var(--line);padding:12px 0 4px;gap:8px;position:sticky;bottom:0;background:linear-gradient(#08080800,#080808 18%)}
.prompt span{color:var(--green);font-weight:700}.prompt input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#d8ffde;font:inherit;font-size:14px}
.cursor{display:inline-block;width:8px;height:16px;background:var(--green);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.codebox{display:none;position:fixed;right:18px;bottom:58px;width:min(560px,calc(100% - 36px));max-height:55vh;background:#030603;border:1px solid #255b2b;box-shadow:0 8px 40px #000;padding:0;z-index:5}
.codehead{display:flex;justify-content:space-between;padding:7px 10px;background:#091309;color:var(--dim);border-bottom:1px solid #173017;font-size:11px}
#code{margin:0;width:100%;height:280px;resize:vertical;background:#020402;color:#caffd1;border:0;outline:0;padding:12px;font:13px/1.5 "Courier New",monospace}
#runout{border-top:1px solid #173017;padding:10px;max-height:150px;overflow:auto;color:#e2ffe7;white-space:pre-wrap;font-size:12px}
.close{background:none;color:var(--green);border:0;font:inherit;cursor:pointer}
@media(max-width:600px){.screen{padding:12px}.header{height:44px}.title{font-size:12px}.status{font-size:9px}#output{font-size:13px}.codebox{right:8px;bottom:58px;width:calc(100% - 16px)}}
</style>
</head>
<body>
<div class="terminal">
<header class="header">
  <div class="title">◈ Py-Code AI</div>
  <div class="status">PROFESSOR INTERATIVO</div>
</header>
<main class="screen">
  <div id="output" aria-live="polite"></div>
  <div id="menu" class="menu"></div>
  <div class="prompt">
    <span>&gt;</span>
    <input id="input" autocomplete="off" autofocus aria-label="Comando do terminal" placeholder="digite uma opção..." />
    <i class="cursor"></i>
  </div>
</main>
</div>

<div id="codebox" class="codebox">
  <div class="codehead"><span>programa.py</span><button class="close" id="closeCode">[ fechar ]</button></div>
  <textarea id="code" spellcheck="false"></textarea>
  <div id="runout">SAÍDA</div>
</div>

<script>
"use strict";
const lessons={
 listas:{title:"Listas Python",intro:"Uma lista guarda vários valores em uma única variável. Vamos construir uma lista de frutas.",steps:[
 ["frutas = [\"maçã\", \"banana\", \"uva\"]","Criamos a variável frutas. Os colchetes [ ] indicam uma lista, e cada texto entre aspas é um elemento."],
 ["print(frutas)","print mostra a lista inteira na tela."],
 ["print(frutas[0])","O índice [0] acessa o primeiro item. Em Python, a contagem começa no zero."],
 ["frutas.append(\"laranja\")","append adiciona um novo item ao final da lista."],
 ["print(frutas)","Agora a lista contém quatro frutas. Você aprendeu a criar, acessar e modificar listas."]],challenge:"Crie uma lista chamada animais com três nomes e mostre o segundo item usando print()."},
 jogos:{title:"Jogos Python",intro:"Vamos criar um jogo simples de adivinhação de números, começando pela lógica.",steps:[
 ["numero_secreto = 7","Guardamos o número que o jogador precisa descobrir."],
 ["palpite = int(input(\"Digite um número: \"))","input recebe o palpite; int transforma o texto digitado em número inteiro."],
 ["if palpite == numero_secreto:","if verifica a condição. O operador == compara dois valores."],
 ["    print(\"Você acertou!\")","Esta linha, recuada, executa quando o palpite está correto."],
 ["else:\n    print(\"Tente novamente!\")","else define o que acontece quando o palpite está errado."]],challenge:"Modifique o número secreto e teste dois palpites diferentes."},
 calculos:{title:"Cálculos Python",intro:"Vamos aprender a fazer operações matemáticas e guardar os resultados.",steps:[
 ["numero1 = 10","Criamos uma variável e guardamos o número 10."],
 ["numero2 = 5","Criamos outra variável com o número 5."],
 ["soma = numero1 + numero2","O operador + soma os valores. O resultado fica guardado em soma."],
 ["print(soma)","Mostramos o resultado da soma: 15."],
 ["print(numero1 - numero2)\nprint(numero1 * numero2)\nprint(numero1 / numero2)","Os operadores -, * e / fazem subtração, multiplicação e divisão."]],challenge:"Crie duas variáveis e mostre a multiplicação entre elas."}
};
const out=document.getElementById("output"),menu=document.getElementById("menu"),input=document.getElementById("input"),box=document.getElementById("codebox"),editor=document.getElementById("code"),runout=document.getElementById("runout");
let topic=null,step=0;
function say(text,role="bot"){const el=document.createElement("div");el.className="line "+role;el.textContent=text;out.appendChild(el);out.scrollTop=out.scrollHeight}
function options(arr){menu.replaceChildren();arr.forEach(([label,command])=>{const b=document.createElement("button");b.textContent=label;b.onclick=()=>send(command);menu.appendChild(b)})}
function home(){topic=null;step=0;say("Prof Python: O que você quer aprender hoje?");options([["Listas Python","listas python"],["Jogos Python","jogos python"],["Cálculos Python","cálculos python"]])}
function start(k){topic=k;step=0;say("Prof Python: Ótima escolha! "+lessons[k].title+".\n\n"+lessons[k].intro+"\n\nVou ensinar uma linha de cada vez.");next()}
function next(){if(!topic)return home();const l=lessons[topic];if(step>=l.steps.length){say("Prof Python: Parabéns! Terminamos esta explicação.\n\nAgora tente: "+l.challenge);options([["Recomeçar aula","recomeçar"],["Escolher outro assunto","menu"]]);return}const [code,explain]=l.steps[step];say("Prof Python — passo "+(step+1)+" de "+l.steps.length+":\n\n"+code+"\n\nExplicação: "+explain);step++;options([["Entendi, próxima linha","próxima"],["Explique novamente","repita"],["Ver código completo","código completo"],["Outro assunto","menu"]])}
function respond(q){const t=q.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();if(t.includes("lista"))return start("listas");if(t.includes("jogo"))return start("jogos");if(t.includes("calculo")||t.includes("matematica")||t.includes("conta"))return start("calculos");if(t==="menu"||t==="inicio"||t==="voltar")return home();if(t==="recomecar"&&topic)return start(topic);if(t.includes("proxim")||t==="entendi"||t==="continuar")return next();if(t.includes("repita")||t.includes("novamente")||t.includes("nao entendi")){if(!topic)return home();step=Math.max(0,step-1);return next()}if(t.includes("codigo completo")&&topic){const src=lessons[topic].steps.map(x=>x[0]).join("\n");editor.value=src;runout.textContent="Código de referência para estudo";box.style.display="block";say("Prof Python: Abri o código completo. Leia cada linha e tente explicar o que ela faz.");return}say("Prof Python: Escolha Listas Python, Jogos Python ou Cálculos Python. Durante a aula, diga próxima, repita ou menu.");if(!topic)home()}
function send(v){const q=(v??input.value).trim();if(!q)return;input.value="";say("Você: "+q,"user");respond(q)}
input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();send()}});document.getElementById("closeCode").onclick=()=>box.style.display="none";home();input.focus();
</script>
</body>
</html>
