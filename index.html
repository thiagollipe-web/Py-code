<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050805">
<title>Py-Code :: Professor Python</title>
<style>
:root{--bg:#080808;--panel:#080c08;--line:#173017;--green:#49ff72;--dim:#6ba978;--cyan:#58e7ff;--yellow:#ffe66d;--red:#ff6262}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020402;color:var(--green);font-family:"Courier New",Consolas,monospace}
body{padding:0}.terminal{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0,#0a160b 0,#080808 45%,#020402 100%)}
.header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:#0b0b0b;box-shadow:0 2px 18px #000}
.title{font-weight:700;letter-spacing:1px}.status{font-size:11px;color:var(--dim)}
.screen{width:min(1100px,100%);margin:0 auto;flex:1;display:flex;flex-direction:column;padding:18px 16px 10px}
#output{flex:1;overflow:auto;white-space:pre-wrap;word-break:break-word;line-height:1.55;font-size:14px;padding-bottom:8px}
.line{margin:0 0 5px}.bot{color:var(--green)}.user{color:var(--cyan)}.system{color:var(--dim)}.warn{color:var(--yellow)}.error{color:var(--red)}
.menu{margin:7px 0 15px;padding-left:18px;color:#b7ffc3}
.menu button{display:block;width:100%;max-width:760px;text-align:left;margin:5px 0;padding:7px 9px;background:#0b0b0b;color:var(--green);border:1px solid #1d481f;font:inherit;cursor:pointer}
.menu button:hover,.menu button:focus{background:#0c1d0d;border-color:var(--green);outline:none}
.prompt{display:flex;align-items:center;border-top:1px solid var(--line);padding:12px 0 4px;gap:8px;position:sticky;bottom:0;background:linear-gradient(#08080800,#080808 18%)}
.prompt span{color:var(--green);font-weight:700}.prompt input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#d8ffde;font:inherit;font-size:14px}
.cursor{display:inline-block;width:8px;height:16px;background:var(--green);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.codebox{display:none;position:fixed;right:18px;bottom:58px;width:min(560px,calc(100% - 36px));max-height:55vh;background:#030603;border:1px solid #255b2b;box-shadow:0 8px 40px #000;padding:0;z-index:5}
.codehead{display:flex;justify-content:space-between;padding:7px 10px;background:#091309;color:var(--dim);border-bottom:1px solid #173017;font-size:11px}
#code{margin:0;width:100%;height:280px;resize:vertical;background:#020402;color:#caffd1;border:0;outline:0;padding:12px;font:13px/1.5 "Courier New",monospace}
#runout{border-top:1px solid #173017;padding:10px;max-height:150px;overflow:auto;color:#e2ffe7;white-space:pre-wrap;font-size:12px}
.close{background:none;color:var(--green);border:0;font:inherit;cursor:pointer}
@media(max-width:600px){.screen{padding:12px}.header{height:44px}.title{font-size:12px}.status{font-size:9px}#output{font-size:13px}.codebox{right:8px;bottom:58px;width:calc(100% - 16px)}}
</style>
</head>
<body>
<div class="terminal">
<header class="header">
  <div class="title">◈ Py-Code AI</div>
  <div class="status">IA LOCAL // PRONTA</div>
</header>
<main class="screen">
  <div id="output" aria-live="polite"></div>
  <div id="menu" class="menu"></div>
  <div class="prompt">
    <span>&gt;</span>
    <input id="input" autocomplete="off" autofocus aria-label="Comando do terminal" placeholder="digite uma opção..." />
    <i class="cursor"></i>
  </div>
</main>
</div>

<div id="codebox" class="codebox">
  <div class="codehead"><span>programa.py</span><button class="close" id="closeCode">[ fechar ]</button></div>
  <textarea id="code" spellcheck="false"></textarea>
  <div id="runout">SAÍDA</div>
</div>

<script>
"use strict";

/*
  BANCO DE CONTEÚDO:
  Estrutura estática em JavaScript para GitHub Pages.
  ÁRVORE:
    menu principal -> módulo -> conceito -> exemplo/exercício -> próximo módulo
*/
const CURSO=[
 {id:1,nome:"Variáveis e Tipos de Dados",
  conceito:"Variáveis armazenam valores. Python possui tipos como str, int, float e bool.",
  exemplos:[
   ['EXEMPLO 01','nome = "Ana"\nidade = 13\naltura = 1.62\naluno = True\n\nprint(nome)\nprint(idade)\nprint(altura)\nprint(aluno)','Ana\n13\n1.62\nTrue'],
   ['EXEMPLO 02','nome = "Ana"\nidade = 13\n\nprint(type(nome))\nprint(type(idade))',"<class \'str\'>\n<class \'int\'>"]
  ],
  exercicio:['Crie uma variável chamada pontos com o valor 100 e mostre esse valor usando print().','pontos = 100\nprint(pontos)','A variável pontos guarda 100.']
 },
 {id:2,nome:"Estruturas Condicionais (if/else)",
  conceito:"if, elif e else permitem que o programa tome decisões.",
  exemplos:[
   ['EXEMPLO 01','idade = 15\n\nif idade >= 18:\n    print("Maior de idade")\nelse:\n    print("Menor de idade")','Menor de idade'],
   ['EXEMPLO 02','nota = 8\n\nif nota >= 9:\n    print("Excelente")\nelif nota >= 6:\n    print("Aprovado")\nelse:\n    print("Estude mais")','Aprovado']
  ],
  exercicio:['Leia a idade e informe se o aluno é maior ou menor de idade.','idade = int(input("Digite sua idade: "))\n\nif idade >= 18:\n    print("Maior de idade")\nelse:\n    print("Menor de idade")','A condição principal é idade >= 18.']
 },
 {id:3,nome:"Laços de Repetição (for/while)",
  conceito:"for e while repetem instruções. for é comum quando conhecemos a quantidade de repetições; while depende de uma condição.",
  exemplos:[
   ['EXEMPLO 01','for numero in range(1, 6):\n    print(numero)','1\n2\n3\n4\n5'],
   ['EXEMPLO 02','contador = 1\n\nwhile contador <= 3:\n    print(contador)\n    contador += 1','1\n2\n3']
  ],
  exercicio:['Mostre os números de 1 a 10 usando um laço for.','for numero in range(1, 11):\n    print(numero)','range(1, 11) começa em 1 e para antes de 11.']
 }
];

const state={modulo:0,etapa:"inicio",exemplo:0,exercicios:0};
const out=document.getElementById("output"), menu=document.getElementById("menu"), input=document.getElementById("input");
const codebox=document.getElementById("codebox"), code=document.getElementById("code"), runout=document.getElementById("runout");

function print(text="",cls="bot"){
  const el=document.createElement("div");el.className="line "+cls;el.textContent=text;out.appendChild(el);out.scrollTop=out.scrollHeight;
}
function menuItems(items){
  menu.innerHTML="";
  items.forEach((label,i)=>{
    const b=document.createElement("button");b.textContent="["+(i+1)+"] "+label;
    b.onclick=()=>{print("> "+(i+1),"user");choose(String(i+1));};menu.appendChild(b);
  });
}
function current(){return CURSO[state.modulo]}
function showMain(){
  state.etapa="inicio";
  print("");
  print("PY-CODE / PROFESSOR PYTHON");
  print("---------------------------");
  print("Olá, aluno.");
  print("Este é um curso de Python no estilo terminal.");
  print("");
  print("Escolha uma opção:");
  menuItems(["Módulo 1 — Variáveis e Tipos de Dados","Módulo 2 — Estruturas Condicionais (if/else)","Módulo 3 — Laços de Repetição (for/while)","Ver progresso"]);
}
function showModule(){
  const m=current();state.etapa="modulo";state.exemplo=0;
  print("");
  print("MODULE "+m.id+" :: "+m.nome);
  print("------------------------------------------------");
  print(m.conceito);
  print("");
  menuItems(["Ver exemplo prático","Fazer exercício","Avançar para o próximo módulo","Voltar ao menu principal"]);
}
function showExample(){
  const m=current(),e=m.exemplos[state.exemplo];state.etapa="exemplo";
  print("");
  print(e[0]);
  print("------------------------------------------------");
  print("Código aberto no editor.");
  openCode(e[1],e[2]);
  menuItems(["Ver outro exemplo","Fazer exercício","Voltar ao módulo"]);
}
function showExercise(){
  const m=current();state.etapa="exercicio";
  print("");
  print("DESAFIO");
  print("------------------------------------------------");
  print(m.exercicio[0]);
  print("");
  print("[1] Ver pista");
  print("[2] Ver solução de referência");
  print("[3] Voltar");
  menuItems(["Ver pista","Mostrar solução de referência","Voltar ao módulo"]);
}
function showProgress(){
  state.etapa="progresso";
  print("");
  print("PROGRESSO");
  print("------------------------------------------------");
  print("Módulo atual: "+(state.modulo+1)+"/"+CURSO.length);
  print("Exercícios consultados: "+state.exercicios);
  print("");
  menuItems(["Voltar ao menu principal","Continuar no módulo atual"]);
}
function invalid(){
  print("Desculpe, não entendi o comando. Por favor, escolha uma das opções válidas do menu.","error");
  if(state.etapa==="inicio")showMain();
  else if(state.etapa==="modulo")showModule();
  else if(state.etapa==="exemplo")showExample();
  else if(state.etapa==="exercicio")showExercise();
  else showMain();
}
function naturalAnswer(v){const t=v.toLowerCase();if(/^(oi|olá|ola|hello|bom dia|boa tarde|boa noite)/.test(t)){print('Olá! Eu sou o Professor Python. Pode conversar comigo normalmente. Pergunte sobre Python, peça exemplos ou exercícios.');return true}if(/(começar|comecar|curso|do zero|iniciar)/.test(t)){state.modulo=0;showModule();return true}if(/(exercício|exercicio|desafio|praticar)/.test(t)){showExercise();return true}if(/(pista|dica)/.test(t)){print('PISTA: '+current().exercicio[2]);return true}if(/(solução|solucao|resposta)/.test(t)){openCode(current().exercicio[1],'Solução de referência');print('Abri uma solução de referência no editor.');return true}if(/(exemplo|código|codigo)/.test(t)){showExample();return true}const m=CURSO.findIndex(x=>x.palavras.some(p=>t.includes(p)));if(m>=0){state.modulo=m;showModule();return true}if(t.includes('print')){print('print() mostra um valor na tela. Exemplo: print("Olá, mundo!")');return true}if(t.includes('input')){print('input() recebe texto do usuário. Para número inteiro, use int(input(...)).');return true}if(/erro|bug|não funciona|nao funciona/.test(t)){print('Cole seu código Python e a mensagem de erro. Eu analiso o problema com você.');return true}return false}\nfunction choose(v){\n  if(naturalAnswer(v))return;
  const n=Number(v),m=current();
  if(state.etapa==="inicio"){
    if(n>=1&&n<=3){state.modulo=n-1;showModule();return}
    if(n===4){showProgress();return}
    invalid();return;
  }
  if(state.etapa==="modulo"){
    if(n===1){showExample();return}
    if(n===2){showExercise();return}
    if(n===3){
      if(state.modulo<CURSO.length-1){state.modulo++;showModule()}else{print("Você chegou ao último módulo.");showMain()}
      return;
    }
    if(n===4){showMain();return}
    invalid();return;
  }
  if(state.etapa==="exemplo"){
    if(n===1){state.exemplo=(state.exemplo+1)%m.exemplos.length;showExample();return}
    if(n===2){showExercise();return}
    if(n===3){showModule();return}
    invalid();return;
  }
  if(state.etapa==="exercicio"){
    if(n===1){print("PISTA: "+m.exercicio[2]);return}
    if(n===2){state.exercicios++;openCode(m.exercicio[1],"Solução de referência carregada.");print("Compare a solução com a sua tentativa.");return}
    if(n===3){showModule();return}
    invalid();return;
  }
  if(state.etapa==="progresso"){
    if(n===1){showMain();return}
    if(n===2){showModule();return}
    invalid();return;
  }
}
function openCode(source,output){
  code.value=source;runout.textContent="SAÍDA\n"+output;codebox.style.display="block";
}
document.getElementById("closeCode").onclick=()=>codebox.style.display="none";
function send(){
  const v=input.value.trim();if(!v)return;
  print("> "+v,"user");input.value="";
  choose(v);
}
input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();send()}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")codebox.style.display="none";
});
showMain();
input.focus();
</script>
</body>
</html>
