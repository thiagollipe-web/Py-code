<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050805">
<title>Py-Code :: Professor Python</title>
<style>
:root{--bg:#080808;--panel:#080c08;--line:#173017;--green:#49ff72;--dim:#6ba978;--cyan:#58e7ff;--yellow:#ffe66d;--red:#ff6262}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020402;color:var(--green);font-family:"Courier New",Consolas,monospace}
body{padding:0}.terminal{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0,#0a160b 0,#080808 45%,#020402 100%)}
.header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:#0b0b0b;box-shadow:0 2px 18px #000}
.title{font-weight:700;letter-spacing:1px}.status{font-size:11px;color:var(--dim)}
.screen{width:min(1100px,100%);margin:0 auto;flex:1;display:flex;flex-direction:column;padding:18px 16px 10px}
#output{flex:1;overflow:auto;white-space:pre-wrap;word-break:break-word;line-height:1.55;font-size:14px;padding-bottom:8px}
.line{margin:0 0 5px}.bot{color:var(--green)}.user{color:var(--cyan)}.system{color:var(--dim)}.warn{color:var(--yellow)}.error{color:var(--red)}
.menu{margin:7px 0 15px;padding-left:18px;color:#b7ffc3}
.menu button{display:block;width:100%;max-width:760px;text-align:left;margin:5px 0;padding:7px 9px;background:#0b0b0b;color:var(--green);border:1px solid #1d481f;font:inherit;cursor:pointer}
.menu button:hover,.menu button:focus{background:#0c1d0d;border-color:var(--green);outline:none}
.prompt{display:flex;align-items:center;border-top:1px solid var(--line);padding:12px 0 4px;gap:8px;position:sticky;bottom:0;background:linear-gradient(#08080800,#080808 18%)}
.prompt span{color:var(--green);font-weight:700}.prompt input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#d8ffde;font:inherit;font-size:14px}
.cursor{display:inline-block;width:8px;height:16px;background:var(--green);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.codebox{display:none;position:fixed;right:18px;bottom:58px;width:min(560px,calc(100% - 36px));max-height:55vh;background:#030603;border:1px solid #255b2b;box-shadow:0 8px 40px #000;padding:0;z-index:5}
.codehead{display:flex;justify-content:space-between;padding:7px 10px;background:#091309;color:var(--dim);border-bottom:1px solid #173017;font-size:11px}
#code{margin:0;width:100%;height:280px;resize:vertical;background:#020402;color:#caffd1;border:0;outline:0;padding:12px;font:13px/1.5 "Courier New",monospace}
#runout{border-top:1px solid #173017;padding:10px;max-height:150px;overflow:auto;color:#e2ffe7;white-space:pre-wrap;font-size:12px}
.close{background:none;color:var(--green);border:0;font:inherit;cursor:pointer}
@media(max-width:600px){.screen{padding:12px}.header{height:44px}.title{font-size:12px}.status{font-size:9px}#output{font-size:13px}.codebox{right:8px;bottom:58px;width:calc(100% - 16px)}}
</style>
</head>
<body>
<div class="terminal">
<header class="header">
  <div class="title">◈ Py-Code AI</div>
  <div class="status">IA LOCAL // PRONTA</div>
</header>
<main class="screen">
  <div id="output" aria-live="polite"></div>
  <div id="menu" class="menu"></div>
  <div class="prompt">
    <span>&gt;</span>
    <input id="input" autocomplete="off" autofocus aria-label="Comando do terminal" placeholder="digite uma opção..." />
    <i class="cursor"></i>
  </div>
</main>
</div>

<div id="codebox" class="codebox">
  <div class="codehead"><span>programa.py</span><button class="close" id="closeCode">[ fechar ]</button></div>
  <textarea id="code" spellcheck="false"></textarea>
  <div id="runout">SAÍDA</div>
</div>

<script>"use strict";
const STATE={modulo:0,modo:"inicio",tentativas:0};
const CURSO=[
{nome:"Variáveis e Tipos de Dados",palavras:["variável","variaveis","tipo","str","int","float","bool"],conceito:"Variáveis são nomes usados para guardar valores. Os tipos mais comuns no início são str, int, float e bool.",exemplo:['nome = "Ana"\\nidade = 13\\nprint(nome)\\nprint(idade)','Ana\\n13'],exercicio:"Crie uma variável chamada pontos com o valor 100 e mostre usando print().",solucao:"pontos = 100\\nprint(pontos)",pista:"Use pontos = 100 e depois print(pontos)."},
{nome:"Estruturas Condicionais (if/else)",palavras:["if","else","elif","condição","condicional"],conceito:"if, elif e else permitem que o programa tome decisões a partir de condições.",exemplo:['idade = 15\\n\\nif idade >= 18:\\n    print("Maior de idade")\\nelse:\\n    print("Menor de idade")','Menor de idade'],exercicio:"Faça um programa que informe se uma pessoa é maior ou menor de idade.",solucao:'idade = int(input("Digite a idade: "))\\n\\nif idade >= 18:\\n    print("Maior")\\nelse:\\n    print("Menor")',pista:"Teste a condição idade >= 18."},
{nome:"Laços de Repetição (for/while)",palavras:["for","while","laço","laco","loop","range"],conceito:"for e while repetem instruções. for é útil para percorrer sequências; while depende de uma condição.",exemplo:['for numero in range(1, 6):\\n    print(numero)','1\\n2\\n3\\n4\\n5'],exercicio:"Mostre os números de 1 a 10 usando for.",solucao:"for numero in range(1, 11):\\n    print(numero)",pista:"Use range(1, 11)."}
];
const out=document.getElementById("output"),menu=document.getElementById("menu"),input=document.getElementById("input"),codebox=document.getElementById("codebox"),code=document.getElementById("code"),runout=document.getElementById("runout");
function print(text="",cls="bot"){const el=document.createElement("div");el.className="line "+cls;el.textContent=text;out.appendChild(el);out.scrollTop=out.scrollHeight}
function current(){return CURSO[STATE.modulo]}
function menuItems(items){menu.innerHTML="";items.forEach((label,i)=>{const b=document.createElement("button");b.textContent="["+(i+1)+"] "+label;b.onclick=()=>sendValue(String(i+1));menu.appendChild(b)})}
function openCode(src,result){code.value=src;runout.textContent="SAÍDA\n"+result;codebox.style.display="block"}
function welcome(){print("Olá! Eu sou o Professor Python.\n\nVou agir como seu professor: explico, faço perguntas, dou pistas, corrijo seus códigos e acompanho seu progresso.\n\nVocê pode conversar normalmente. Ex.: \"não entendi if\", \"me dê um exercício\", \"mostre um exemplo\" ou cole seu código.")}
function teacher(q){const t=q.toLowerCase().trim(),m=current();
if(/^(oi|olá|ola|bom dia|boa tarde|boa noite|hello)/.test(t)){print("Olá! Vamos estudar Python. Qual assunto está causando dificuldade?");return}
if(/(começar|comecar|curso|do zero|iniciar)/.test(t)){STATE.modulo=0;STATE.modo="modulo";print("Perfeito. Vamos começar pela primeira aula: "+current().nome+".\n\n"+current().conceito);menuItems(["Ver exemplo","Fazer exercício","Próxima aula"]);return}
if(/(exercício|exercicio|desafio|atividade|praticar)/.test(t)){STATE.modo="exercicio";STATE.tentativas++;print("Exercício:\n\n"+m.exercicio+"\n\nTente primeiro. Depois cole sua resposta aqui.");return}
if(/^(pista|dica|ajuda)/.test(t)){print("Pista: "+m.pista);return}
if(/(solução|solucao|resposta pronta)/.test(t)){openCode(m.solucao,"Solução de referência");print("Abri a solução. Compare com sua tentativa e tente explicar por que cada linha está ali.");return}
if(/(exemplo|mostrar código|mostrar codigo|mostre código|mostre codigo)/.test(t)){STATE.modo="exemplo";openCode(m.exemplo[0],m.exemplo[1]);print("Exemplo aberto. Posso explicar linha por linha.");return}
if(/(próxima aula|proxima aula|avançar|avancar|próximo módulo|proximo modulo)/.test(t)){STATE.modulo=Math.min(STATE.modulo+1,CURSO.length-1);STATE.modo="modulo";print("Agora estamos na aula "+(STATE.modulo+1)+": "+current().nome+".\n\n"+current().conceito);menuItems(["Ver exemplo","Fazer exercício","Próxima aula"]);return}
if(/(progresso|meu progresso)/.test(t)){print("Você está na aula "+(STATE.modulo+1)+" de "+CURSO.length+". Tentativas de exercícios nesta sessão: "+STATE.tentativas+".");return}
const found=CURSO.findIndex(x=>x.palavras.some(p=>t.includes(p)));if(found>=0){STATE.modulo=found;STATE.modo="modulo";print("Vamos estudar "+current().nome+".\n\n"+current().conceito+"\n\nQuer um exemplo, uma explicação passo a passo ou um exercício?");return}
if(/(erro|bug|não funciona|nao funciona|corrija|corrigir|está certo|esta certo)/.test(t)){print("Cole seu código aqui. Vou analisar como um professor: identificar o erro, explicar o motivo e dar uma pista para você corrigir. Não vou entregar a resposta sem antes tentar ensinar o raciocínio.");return}
if(/print\s*\(/.test(t)){print("print() mostra um valor na tela. Exemplo: print(\"Olá, mundo!\"). Quer praticar?");return}
if(/input\s*\(/.test(t)){print("input() recebe texto digitado pelo usuário. Para transformar em inteiro, use int(input(...)).");return}
print("Ainda não encontrei esse assunto no meu conteúdo local. Pergunte sobre variáveis, if/else, for, while, print, input ou cole um código Python.")
}
function sendValue(q){print("> "+q,"user");teacher(q)}
function send(){const q=input.value.trim();if(!q)return;input.value="";sendValue(q)}
input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();send()}});
document.getElementById("closeCode").onclick=()=>codebox.style.display="none";
document.addEventListener("keydown",e=>{if(e.key==="Escape")codebox.style.display="none"});
welcome();input.focus();</script>
</body>
</html>
