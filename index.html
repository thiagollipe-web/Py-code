<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="description" content="Py-Code — terminal Python leve no navegador.">
<link rel="manifest" href="./manifest.webmanifest">
<title>Py-Code — Terminal Python</title>
<style>
:root{
  --bg:#080b12;
  --panel:#0d111a;
  --panel2:#111827;
  --text:#e6edf3;
  --muted:#7d8b99;
  --cyan:#22d3ee;
  --green:#4ade80;
  --yellow:#facc15;
  --pink:#f472b6;
  --red:#fb7185;
  --blue:#60a5fa;
  --border:#263244;
  --editor:#0a0f18;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Consolas,"Courier New",monospace}
body{display:flex;flex-direction:column;overflow:hidden}
button{
  border:1px solid var(--border);background:#121a27;color:var(--text);
  border-radius:5px;padding:8px 12px;font:700 12px Consolas,monospace;
  cursor:pointer;min-height:36px
}
button:hover{border-color:var(--cyan);color:var(--cyan)}
button:disabled{opacity:.45;cursor:not-allowed}
header{
  flex:0 0 auto;border-bottom:1px solid var(--border);
  background:linear-gradient(90deg,#0b111b,#101827);
  padding:10px 14px
}
.top{display:flex;align-items:center;gap:14px;justify-content:space-between}
.brand{font-size:18px;font-weight:800;letter-spacing:2px;color:var(--cyan)}
.sub{font-size:11px;color:var(--muted);margin-top:3px}
.status{font-size:11px;color:var(--green)}
.controls{display:flex;gap:6px;flex-wrap:wrap}
main{
  flex:1;min-height:0;display:grid;
  grid-template-rows:minmax(260px,1fr) minmax(210px,.8fr);
}
.panel{min-height:0;display:flex;flex-direction:column}
.panel-title{
  flex:0 0 auto;height:34px;display:flex;align-items:center;
  justify-content:space-between;padding:0 12px;
  background:var(--panel);border-bottom:1px solid var(--border);
  color:var(--cyan);font-size:12px
}
.panel-title span:last-child{color:var(--muted);font-weight:400}
#code{
  flex:1;width:100%;min-height:0;resize:none;border:0;outline:0;
  padding:14px;background:var(--editor);color:#d1fae5;
  font:14px/1.55 Consolas,"Courier New",monospace;
  tab-size:4;white-space:pre;caret-color:var(--yellow)
}
#code:focus{box-shadow:inset 2px 0 0 var(--cyan)}
#terminal{
  flex:1;min-height:0;overflow:auto;padding:12px 14px;
  background:#06080d;color:#dbeafe;font:13px/1.55 Consolas,"Courier New",monospace;
  white-space:pre-wrap;word-break:break-word
}
.line{min-height:20px}
.out{color:#dbeafe}
.info{color:var(--cyan)}
.ok{color:var(--green)}
.warn{color:var(--yellow)}
.err{color:var(--red)}
.prompt{color:var(--pink)}
.meta{color:var(--muted)}
.cursor{display:inline-block;width:7px;height:14px;background:var(--green);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
footer{
  flex:0 0 auto;border-top:1px solid var(--border);background:#0b1018;
  color:var(--muted);font-size:10px;padding:5px 10px;display:flex;justify-content:space-between
}
@media(max-width:700px){
  body{overflow:auto}
  header{padding:8px}
  .top{align-items:flex-start;flex-wrap:wrap}
  .controls{width:100%}
  .controls button{flex:1}
  main{min-height:calc(100dvh - 116px);grid-template-rows:55dvh 45dvh}
  #code{font-size:13px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <div class="brand">PY-CODE</div>
      <div class="sub">TERMINAL PYTHON • LEVE • COLORIDO • SEM DESIGNER</div>
    </div>
    <div id="status" class="status">CARREGANDO PYTHON...</div>
    <div class="controls">
      <button id="clear" type="button">LIMPAR</button>
      <button id="download" type="button">BAIXAR .PY</button>
      <button id="run" type="button" disabled>EXECUTAR</button>
      <button id="stop" type="button" disabled>PARAR</button>
    </div>
  </div>
</header>

<main>
  <section class="panel">
    <div class="panel-title">
      <span>▸ PROGRAMA.PY</span>
      <span>CTRL + ENTER para executar</span>
    </div>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  </section>

  <section class="panel">
    <div class="panel-title">
      <span>▸ TERMINAL</span>
      <span id="network">ONLINE</span>
    </div>
    <div id="terminal" aria-live="polite"></div>
  </section>
</main>

<footer>
  <span>Python executado no navegador com Pyodide</span>
  <span id="version">Py-Code</span>
</footer>

<script>
"use strict";

const $=id=>document.getElementById(id);
const editor=$("code");
const terminal=$("terminal");
const run=$("run");
const stop=$("stop");
const status=$("status");
let worker=null;
let ready=false;
let running=false;
let timeoutId=null;

const DEFAULT_CODE=`# Py-Code
# Um terminal simples para aprender Python.

print("================================")
print("        PY-CODE TERMINAL")
print("================================")
print()

nome = "Python"
for numero in range(1, 6):
    print(f"{numero} -> Olá, {nome}!")

print()
print("2 + 3 =", 2 + 3)
print("Programa executado com sucesso.")
`;

function salvar(){
  try{localStorage.setItem("pycode_codigo",editor.value)}catch(_){}
}

function carregar(){
  try{
    editor.value=localStorage.getItem("pycode_codigo")||DEFAULT_CODE;
  }catch(_){
    editor.value=DEFAULT_CODE;
  }
}

function linha(texto,classe="out"){
  const div=document.createElement("div");
  div.className="line "+classe;
  div.textContent=String(texto);
  terminal.appendChild(div);
  terminal.scrollTop=terminal.scrollHeight;
}

function limparTerminal(){
  terminal.innerHTML="";
}

function mensagemInicial(){
  limparTerminal();
  linha("PY-CODE TERMINAL","info");
  linha("Python no navegador.","meta");
  linha("Digite seu código no editor e pressione EXECUTAR.","meta");
  linha("","meta");
  linha("$ pronto","prompt");
}

function setStatus(texto,classe=""){
  status.textContent=texto;
  status.className="status "+classe;
}

function novoWorker(){
  if(worker) worker.terminate();
  worker=new Worker("./pycode-worker.js");

  worker.onmessage=e=>{
    const m=e.data||{};

    if(m.type==="status"){
      setStatus(m.value);
      return;
    }

    if(m.type==="ready"){
      ready=true;
      run.disabled=false;
      setStatus("PYTHON PRONTO","ok");
      return;
    }

    if(m.type==="stdout"){
      const valor=String(m.value||"");
      valor.split(/\r?\n/).forEach(v=>{
        if(v!=="") linha(v,"out");
      });
      return;
    }

    if(m.type==="stderr"){
      const valor=String(m.value||"");
      valor.split(/\r?\n/).forEach(v=>{
        if(v!=="") linha(v,"err");
      });
      return;
    }

    if(m.type==="done"){
      if(timeoutId)clearTimeout(timeoutId);
      timeoutId=null;
      running=false;
      stop.disabled=true;
      run.disabled=false;
      linha("","meta");
      linha("✓ programa finalizado","ok");
      setStatus("PYTHON PRONTO","ok");
      return;
    }

    if(m.type==="error"||m.type==="fatal"){
      if(timeoutId)clearTimeout(timeoutId);
      timeoutId=null;
      running=false;
      stop.disabled=true;
      run.disabled=false;
      linha(String(m.value||"Erro desconhecido"),"err");
      setStatus("ERRO PYTHON","err");
    }
  };

  worker.onerror=e=>{
    ready=false;
    running=false;
    run.disabled=true;
    stop.disabled=true;
    linha(e.message||"Falha no Worker","err");
    setStatus("FALHA NO RUNTIME","err");
  };

  worker.postMessage({type:"boot"});
}

function executar(){
  if(!ready||running)return;

  salvar();
  running=true;
  run.disabled=true;
  stop.disabled=false;

  linha("$ python programa.py","prompt");
  setStatus("EXECUTANDO...");

  worker.postMessage({type:"run",code:editor.value});

  timeoutId=setTimeout(()=>{
    if(running){
      linha("Tempo limite atingido. O processo foi interrompido.","err");
      parar(true);
    }
  },10000);
}

function parar(silencioso=false){
  if(timeoutId)clearTimeout(timeoutId);
  timeoutId=null;

  running=false;
  ready=false;

  if(worker)worker.terminate();
  worker=null;

  stop.disabled=true;
  run.disabled=true;

  if(!silencioso)linha("^C processo interrompido pelo usuário.","warn");

  setStatus("REINICIANDO PYTHON...");
  novoWorker();
}

editor.addEventListener("input",salvar);

editor.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){
    e.preventDefault();
    executar();
    return;
  }

  if(e.key==="Tab"){
    e.preventDefault();
    const a=editor.selectionStart;
    const b=editor.selectionEnd;
    editor.setRangeText("    ",a,b,"end");
    salvar();
  }
});

$("clear").onclick=()=>{
  limparTerminal();
  linha("$ terminal limpo","meta");
};

$("run").onclick=executar;
$("stop").onclick=()=>parar(false);

$("download").onclick=()=>{
  const blob=new Blob([editor.value],{type:"text/x-python;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="programa.py";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};

function rede(){
  $("network").textContent=navigator.onLine?"ONLINE":"OFFLINE";
}
addEventListener("online",rede);
addEventListener("offline",rede);

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

carregar();
mensagemInicial();
rede();
novoWorker();
</script>
</body>
</html>
