<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="Py-Code — Python educativo no navegador, com terminal, HTML e Canvas.">
<meta name="application-name" content="Py-Code">
<link rel="manifest" href="./manifest.webmanifest">
<title>Py-Code | Python + HTML + Canvas</title>
<style>
:root{--bg:#000;--panel:#050505;--fg:#00ff66;--muted:#74a98b;--border:#00ff66;--editor:#001407}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:"Courier New",monospace}
body{min-height:100dvh;overflow:hidden}
button{font:700 14px "Courier New",monospace;color:var(--fg);background:#001a08;border:1px solid var(--border);padding:10px 12px;border-radius:6px;cursor:pointer;min-height:42px}
button:hover{background:#00310f}button:disabled{opacity:.45;cursor:not-allowed}
header{background:var(--panel);border-bottom:2px solid var(--border);padding:10px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-size:20px;font-weight:800;letter-spacing:2px}.status{font-size:12px;color:var(--muted);min-height:18px}
#online{white-space:nowrap}.controls{display:flex;gap:8px;flex-wrap:wrap}
main{height:calc(100dvh - 310px);display:grid;grid-template-rows:minmax(240px,1fr) minmax(220px,.85fr);min-height:0}
#blocks{background:#020602;border-bottom:1px solid var(--border);padding:8px;overflow:auto;max-height:205px}\n#blocks-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;font-size:12px;letter-spacing:1px}\n.block-tabs{display:flex;gap:5px;overflow:auto;padding-bottom:6px}\n.block-tab{min-height:30px;padding:5px 9px;font-size:11px;flex:0 0 auto}\n.block-tab.active{background:#064d1b}\n.block-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:6px}\n.code-block{border:0;border-radius:7px;color:#fff;text-align:left;padding:8px 9px;min-height:52px;cursor:grab;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);font:700 12px/1.2 "Courier New",monospace}\n.code-block:active{cursor:grabbing}\n.code-block small{display:block;margin-top:4px;font-weight:400;opacity:.8}\n.block-mov{background:#146c2e}.block-fis{background:#7a4f10}.block-ctrl{background:#6b2a82}.block-ent{background:#175f78}.block-apa{background:#9a3a16}.block-som{background:#7b1d4b}.block-cen{background:#3f3f3f}.block-pont{background:#8a7200}\n#editor-container{min-height:0;border-bottom:2px solid var(--border);background:var(--editor);display:flex}
#code{flex:1;width:100%;height:100%;resize:none;border:0;outline:none;padding:12px;background:#001407;color:#00ff66;font:14px/1.5 "Courier New",monospace;tab-size:4;white-space:pre}
#code:focus{box-shadow:inset 0 0 0 1px var(--border)}#code.light-editor{background:#fff;color:#161616}
#display{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,42%);background:#000}
#output{min-width:0;overflow:auto;margin:0;padding:12px;white-space:pre-wrap;word-break:break-word;border-right:1px solid var(--border);font-size:14px;line-height:1.45}
#game{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;background:#020202}
canvas{display:block;width:min(100%,560px);height:auto;max-height:calc(100% - 78px);aspect-ratio:16/9;border:1px dashed var(--border);background:#000;image-rendering:pixelated;touch-action:none}
#touch-controls{display:grid;grid-template-columns:42px 42px 42px 42px 42px;gap:5px;align-items:center;justify-content:center;user-select:none}
#touch-controls .empty{visibility:hidden}.touch{width:42px;height:42px;min-height:42px;padding:0;touch-action:none;-webkit-user-select:none;user-select:none}
.touch.action{font-size:12px}
.light{--bg:#f5f5f5;--panel:#fff;--fg:#161616;--muted:#666;--border:#333;--editor:#fff}
.light #output,.light #game{background:#fff}
@media (max-width:800px){
 body{overflow:auto}#blocks{max-height:245px}main{height:auto;min-height:calc(100dvh - 370px);grid-template-rows:52dvh 48dvh}
 #display{grid-template-columns:1fr;grid-template-rows:1fr minmax(210px,38dvh)}
 #output{border-right:0;border-bottom:1px solid var(--border)}#game{min-height:210px}
 #touch-controls{transform:scale(.95);transform-origin:center}
}
@media (max-width:480px){
 #code{font-size:13px;min-height:280px}header{padding:8px}.brand{font-size:17px}.controls{width:100%}
 button{padding:9px 10px;font-size:12px;flex:1}.top{align-items:flex-start}
 canvas{width:100%;max-height:calc(100% - 72px)}
 #touch-controls{grid-template-columns:38px 38px 38px 38px 38px;gap:4px}
 .touch{width:38px;height:38px}
}
</style>
</head>
<body>
<header><div class="top">
<div><div class="brand">PY-CODE</div><div id="status" class="status">Inicializando…</div></div>
<div id="online" class="status" aria-live="polite">● ONLINE</div>
<div class="controls">
<button id="theme-btn" type="button">TEMA: PRETO</button>
<button id="clear-btn" type="button">LIMPAR</button>
<button id="download-btn" type="button">BAIXAR .PY</button>
<button id="run-btn" type="button" disabled>CARREGANDO…</button>
</div></div></header>
<main>\n<section id="blocks" aria-label="Blocos do Py-Code">\n<div id="blocks-head"><strong>BLOCOS</strong><span>clique ou arraste para o editor</span></div>\n<div class="block-tabs" id="block-tabs"></div>\n<div class="block-grid" id="block-grid"></div>\n</section>
<main>
<section id="editor-container" aria-label="Editor Python">
<textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Código Python"></textarea>
</section>
<section id="display">
<pre id="output" aria-live="polite">Preparando o ambiente Python…</pre>
<div id="game">
<canvas id="canvas" width="320" height="180" aria-label="Tela gráfica"></canvas>
<div id="touch-controls" aria-label="Controles de toque">
<button class="touch empty" tabindex="-1" aria-hidden="true"></button>
<button class="touch" data-key="ArrowUp">▲</button>
<button class="touch empty" tabindex="-1" aria-hidden="true"></button>
<button class="touch action" data-key="x">X</button>
<button class="touch action" data-key="z">Z</button>
<button class="touch" data-key="ArrowLeft">◀</button>
<button class="touch" data-key="ArrowDown">▼</button>
<button class="touch" data-key="ArrowRight">▶</button>
<button class="touch empty" tabindex="-1" aria-hidden="true"></button>
<button class="touch empty" tabindex="-1" aria-hidden="true"></button>
</div>
</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/pyodide/v0.28.2/full/pyodide.js"></script>
<script>
const $=id=>document.getElementById(id);
const output=$("output"),status=$("status"),run=$("run-btn"),themeBtn=$("theme-btn"),
      clearBtn=$("clear-btn"),dl=$("download-btn"),editor=$("code");
const canvas=$("canvas"),ctx=canvas.getContext("2d");\nconst blockTabs=$("block-tabs"),blockGrid=$("block-grid");
let pyodide=null,dark=true,executando=false,animationId=0;

window.__pycode_keys=new Set();
window.pycode_pressed=key=>{
  const k=String(key);
  return window.__pycode_keys.has(k)||window.__pycode_keys.has(k.toLowerCase());
};
window.pycode_image=url=>{const image=new Image();image.src=String(url);return image};

let audioContext=null;
window.pycode_sound=(frequency,duration,type,volume)=>{
  try{
    audioContext??=new (window.AudioContext||window.webkitAudioContext)();
    if(audioContext.state==="suspended")audioContext.resume();
    const osc=audioContext.createOscillator(),gain=audioContext.createGain();
    const v=Math.max(0.0001,Math.min(0.3,Number(volume)||0.05));
    osc.type=type||"square";osc.frequency.value=Number(frequency)||440;
    gain.gain.setValueAtTime(v,audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001,audioContext.currentTime+(Number(duration)||0.12));
    osc.connect(gain);gain.connect(audioContext.destination);
    osc.start();osc.stop(audioContext.currentTime+(Number(duration)||0.12));
  }catch(_){}
};

function teclaDown(key){window.__pycode_keys.add(String(key))}
function teclaUp(key){window.__pycode_keys.delete(String(key))}
addEventListener("keydown",e=>{teclaDown(e.key);teclaDown(e.key.toLowerCase())});
addEventListener("keyup",e=>{teclaUp(e.key);teclaUp(e.key.toLowerCase())});
addEventListener("blur",()=>window.__pycode_keys.clear());

document.querySelectorAll(".touch").forEach(btn=>{
  const key=btn.dataset.key;if(!key)return;
  const down=e=>{e.preventDefault();teclaDown(key);btn.setPointerCapture?.(e.pointerId)};
  const up=e=>{e.preventDefault();teclaUp(key)};
  btn.addEventListener("pointerdown",down);
  btn.addEventListener("pointerup",up);
  btn.addEventListener("pointercancel",up);
  btn.addEventListener("lostpointercapture",up);
});

function setOutput(t){output.textContent=String(t??"")}
function setStatus(t){status.textContent=t}
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height)}
function salvar(){localStorage.setItem("pycode_codigo",editor.value)}
function carregar(){
  const s=localStorage.getItem("pycode_codigo");
  editor.value=s??\`# Py-Code — Scratch em Python
# Python controla a lógica e o Canvas mostra o jogo.

jogador = Sprite(40, 70, 24, 24, "#00ff66")

def atualizar():
    limpar("#081018")

    if pressionado("ArrowRight"):
        jogador.mover(2, 0)
    if pressionado("ArrowLeft"):
        jogador.mover(-2, 0)
    if pressionado("ArrowUp"):
        jogador.mover(0, -2)
    if pressionado("ArrowDown"):
        jogador.mover(0, 2)

    jogador.limite()
    jogador.desenhar()
    mostrar_pontos()
\`;
}

const BLOCOS={
  "Movimento":[
    ["CRIAR SPRITE","jogador = Sprite(40, 70, 24, 24, \"#00ff66\")","block-mov"],
    ["MOVER","jogador.mover(2, 0)","block-mov"],
    ["VELOCIDADE","jogador.velocidade(2, 0)","block-mov"]
  ],
  "Controle":[
    ["ATUALIZAR JOGO","def atualizar():\n    limpar(\"#081018\")\n    jogador.desenhar()","block-ctrl"],
    ["SE TECLA","if pressionado(\"ArrowRight\"):\n    jogador.mover(2, 0)","block-ctrl"],
    ["REPETIR","for i in range(10):\n    print(i)","block-ctrl"]
  ],
  "Aparência":[
    ["LIMPAR TELA","limpar(\"#081018\")","block-apa"],
    ["RETÂNGULO","retangulo(100, 60, 30, 30, \"#00ff66\")","block-apa"],
    ["CÍRCULO","circulo(160, 90, 15, \"#ffcc00\")","block-apa"],
    ["TEXTO","texto(\"Olá!\", 10, 20)","block-apa"]
  ],
  "Física":[
    ["GRAVIDADE","jogador.gravidade(0.5)\njogador.no_chao(165)","block-fis"],
    ["PULAR","jogador.pular(8)","block-fis"],
    ["COLISÃO","if jogador.colide(inimigo):\n    somar_pontos(1)","block-fis"]
  ],
  "Entrada":[
    ["SE DIREITA","if pressionado(\"ArrowRight\"):\n    jogador.mover(2, 0)","block-ent"],
    ["SE ESQUERDA","if pressionado(\"ArrowLeft\"):\n    jogador.mover(-2, 0)","block-ent"],
    ["SE AÇÃO X","if pressionado(\"x\"):\n    tocar(660, 0.08)","block-ent"]
  ],
  "Som":[
    ["TOCAR SOM","tocar(440, 0.12)","block-som"],
    ["SOM DE PONTO","tocar(880, 0.08)\nsomar_pontos(1)","block-som"]
  ],
  "Pontuação":[
    ["+1 PONTO","somar_pontos(1)","block-pont"],
    ["ZERAR PONTOS","zerar_pontos()","block-pont"],
    ["MOSTRAR PONTOS","mostrar_pontos()","block-pont"]
  ],
  "Cenas":[
    ["CRIAR CENA","cena(\"jogo\", iniciar=iniciar_jogo, atualizar=atualizar_jogo)","block-cen"],
    ["MUDAR CENA","mudar_cena(\"jogo\")","block-cen"],
    ["NOME DA CENA","print(cena_atual_nome())","block-cen"]
  ]
};

let blocoCategoria="Movimento";

function inserirBloco(codigo){
  const inicio=editor.selectionStart;
  const fim=editor.selectionEnd;
  const antes=editor.value.slice(0,inicio);
  const depois=editor.value.slice(fim);
  const prefixo=antes && !antes.endsWith("\\n") ? "\\n\\n" : "";
  const sufixo=depois && !depois.startsWith("\\n") ? "\\n" : "";
  editor.value=antes+prefixo+codigo+sufixo+depois;
  const pos=(antes+prefixo+codigo).length;
  editor.focus();
  editor.setSelectionRange(pos,pos);
  salvar();
}

function renderBlocos(){
  blockTabs.innerHTML="";
  blockGrid.innerHTML="";
  Object.keys(BLOCOS).forEach(nome=>{
    const tab=document.createElement("button");
    tab.type="button";tab.className="block-tab"+(nome===blocoCategoria?" active":"");
    tab.textContent=nome;
    tab.onclick=()=>{blocoCategoria=nome;renderBlocos()};
    blockTabs.appendChild(tab);
  });
  BLOCOS[blocoCategoria].forEach(([titulo,codigo,classe])=>{
    const b=document.createElement("button");
    b.type="button";b.draggable=true;b.className="code-block "+classe;
    b.innerHTML=titulo+"<small>"+codigo.replace(/\\n/g," ↵ ")+"</small>";
    b.title="Inserir este bloco Python";
    b.onclick=()=>inserirBloco(codigo);
    b.addEventListener("dragstart",e=>{
      e.dataTransfer.setData("text/plain",codigo);
      e.dataTransfer.effectAllowed="copy";
    });
    blockGrid.appendChild(b);
  });
}

editor.addEventListener("dragover",e=>{e.preventDefault();e.dataTransfer.dropEffect="copy"});
editor.addEventListener("drop",e=>{
  e.preventDefault();
  const codigo=e.dataTransfer.getData("text/plain");
  if(!codigo)return;
  const inicio=editor.selectionStart;
  const antes=editor.value.slice(0,inicio);
  const depois=editor.value.slice(editor.selectionEnd);
  editor.value=antes+codigo+"\\n"+depois;
  const pos=(antes+codigo+"\\n").length;
  editor.focus();editor.setSelectionRange(pos,pos);salvar();
});
renderBlocos();

editor.addEventListener("input",salvar);
editor.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();if(!run.disabled)run.click()}
});
themeBtn.onclick=()=>{
  dark=!dark;document.body.classList.toggle("light",!dark);
  themeBtn.textContent=dark?"TEMA: PRETO":"TEMA: CLARO";
  editor.classList.toggle("light-editor",!dark);
};
clearBtn.onclick=()=>{setOutput("");clearCanvas()};
dl.onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([editor.value],{type:"text/x-python;charset=utf-8"}));
  a.download="programa.py";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

async function carregarPython(){
  setStatus("Carregando Python…");setOutput("PY-CODE\\n\\nBaixando o ambiente Python…");
  try{
    for(let i=0;i<100&&typeof loadPyodide!=="function";i++)await new Promise(r=>setTimeout(r,100));
    if(typeof loadPyodide!=="function")throw new Error("O carregador do Python não foi encontrado.");
    pyodide=await loadPyodide({indexURL:"https://cdn.jsdelivr.net/pyodide/v0.28.2/full/"});
    const engine=await fetch("./pycode.py").then(r=>{if(!r.ok)throw new Error("Não foi possível carregar a engine do Py-Code.");return r.text()});
    pyodide.runPython(engine);
    setOutput("PY-CODE ONLINE\\nPython + HTML + Canvas prontos.\\n\\nEngine: sprites, física, teclas, toque, colisão, pontuação, sons e cenas.");
    setStatus("Python pronto");run.disabled=false;run.textContent="EXECUTAR";
  }catch(e){
    console.error(e);setOutput("NÃO FOI POSSÍVEL INICIAR O PYTHON\\n\\n"+String(e));setStatus("Falha ao carregar Python");
  }
}
async function pararAnimacao(){if(animationId){cancelAnimationFrame(animationId);animationId=0}}
async function iniciarAnimacao(){
  await pararAnimacao();
  let ativo=false;
  try{ativo=Boolean(pyodide.runPython("callable(globals().get('__pycode_frame__'))"))}catch(_){}
  if(!ativo)return;
  const frame=async()=>{
    if(!pyodide)return;
    try{await pyodide.runPythonAsync("__pycode_frame__()")}
    catch(e){setOutput("ERRO NO JOGO:\\n"+String(e));setStatus("Erro na atualização");await pararAnimacao();return}
    animationId=requestAnimationFrame(frame);
  };
  animationId=requestAnimationFrame(frame);
}
run.onclick=async()=>{
  if(!pyodide||executando)return;
  executando=true;run.disabled=true;run.textContent="EXECUTANDO…";
  await pararAnimacao();setOutput("");clearCanvas();
  try{
    salvar();await pyodide.runPythonAsync(editor.value);await iniciarAnimacao();
    output.textContent+=(output.textContent?"\\n\\n":"")+"OK";
  }catch(e){
    console.error(e);output.textContent+=(output.textContent?"\\n\\n":"")+"ERRO:\\n"+String(e);
  }finally{executando=false;run.disabled=false;run.textContent="EXECUTAR"}
};
window.addEventListener("error",e=>{
  if(e?.message){setStatus("Erro no navegador");output.textContent+="\\n\\nERRO DO NAVEGADOR:\\n"+e.message}
});
window.addEventListener("unhandledrejection",e=>{
  const r=String(e?.reason??"Erro assíncrono");setStatus("Erro assíncrono");output.textContent+="\\n\\nERRO ASSÍNCRONO:\\n"+r
});
const online=$("online");
function atualizarRede(){online.textContent=navigator.onLine?"● ONLINE":"● OFFLINE"}
addEventListener("online",atualizarRede);addEventListener("offline",atualizarRede);atualizarRede();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
carregar();clearCanvas();carregarPython();
</script>
</body>
</html>
