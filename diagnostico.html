<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Py-Code — Diagnóstico</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Consolas,"Courier New",monospace}
body{padding:16px}
h1{font-size:18px;margin:0 0 6px}
p{color:#999;font-size:12px}
#log{white-space:pre-wrap;border:1px solid #333;padding:12px;min-height:240px;background:#050505;font-size:12px;line-height:1.55}
.ok{color:#fff}.err{color:#fff}
button{margin-top:10px;padding:9px 12px;background:#111;color:#fff;border:1px solid #555;font:700 12px monospace}
</style>
</head>
<body>
<h1>PY-CODE / DIAGNÓSTICO</h1>
<p>Teste do runtime local, Worker module e execução Python.</p>
<div id="log">Iniciando diagnóstico...</div>
<button id="again">TESTAR NOVAMENTE</button>
<button id="diagnose" type="button">TESTAR INTEGRAÇÃO</button>
<div id="diagnoseOutput"></div>
<script>
"use strict";
const log=document.getElementById("log");
const again=document.getElementById("again");
let linhas=[];
function write(text,ok=true){
  linhas.push((ok?"[OK] ":"[ERRO] ")+text);
  log.textContent=linhas.join("\n");
}
async function check(url){
  const r=await fetch(url,{cache:"no-store",credentials:"same-origin"});
  if(!r.ok)throw new Error(url+" -> HTTP "+r.status);
  return r;
}
async function run(){
  linhas=[];
  log.textContent="Executando...";
  try{
    await check("./pycode-worker.js");
    write("pycode-worker.js acessível");

    await check("./pycode_worker.py");
    write("pycode_worker.py acessível");

    await check("./pyodide/pyodide.mjs");
    write("pyodide.mjs acessível");

    await check("./pyodide/pyodide.js");
    write("pyodide.js acessível");

    await check("./pyodide/pyodide.asm.mjs");
    write("pyodide.asm.mjs acessível");

    const worker=new Worker("./pycode-worker.js?v=33",{type:"module"});
    let terminou=false;

    const fim=(erro)=>{
      if(terminou)return;
      terminou=true;
      clearTimeout(timer);
      worker.terminate();
      if(erro){
        write(erro,false);
      }
    };

    worker.onmessage=e=>{
      const m=e.data||{};
      if(m.type==="status")write("Worker: "+m.value);
      else if(m.type==="ready"){
        write("Worker module + Pyodide carregados");
        worker.postMessage({
          type:"run",
          code:'print("PY-CODE TESTE OK")\nprint(2 + 3)\nprint("fim")'
        });
      }else if(m.type==="stdout"){
        const v=String(m.value||"").trim();
        if(v)write("Python: "+v);
      }else if(m.type==="done"){
        write("EXECUÇÃO PYTHON CONCLUÍDA");
        fim();
      }else if(m.type==="error"||m.type==="fatal"){
        fim("Runtime: "+String(m.value||"erro desconhecido"));
      }
    };

    worker.onerror=e=>fim(
      "Worker JS: "+[e.message,e.filename,e.lineno&&("linha "+e.lineno)].filter(Boolean).join(" • ")
    );

    const timer=setTimeout(()=>fim("Tempo limite: runtime não ficou pronto em 20 segundos."),20000);
    worker.postMessage({type:"boot"});
  }catch(e){
    write(String(e&&e.message||e),false);
  }
}
again.onclick=run;
run();
</script>
<script src="./runtime-diagnostics.js"></script>
</body>
</html>
