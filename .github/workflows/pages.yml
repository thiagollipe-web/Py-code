name: Deploy Py-Code Offline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          set -e
          mkdir -p _site/pyodide
          cp index.html jogo.html diagnostico.html runtime-diagnostics.js professor-bot.js aws-code-library.js code-audit.js manifest.webmanifest pycode-worker.js pycode_worker.py sw.js README.md _site/
          cp -R assets _site/assets

      - name: Bundle Pyodide core localmente
        env:
          PYODIDE_VERSION: "314.0.7"
        run: |
          set -euo pipefail
          mkdir -p _cache/pyodide _site/pyodide
          archive="_cache/pyodide/pyodide-core-${PYODIDE_VERSION}.tar.bz2"
          url="https://github.com/pyodide/pyodide/releases/download/${PYODIDE_VERSION}/pyodide-core-${PYODIDE_VERSION}.tar.bz2"
          echo "Baixando Pyodide core local..."
          curl --fail --location --retry 4 --retry-delay 2 "$url" -o "$archive"
          tar -xjf "$archive" -C _cache/pyodide --strip-components=1
          cp -R _cache/pyodide/. _site/pyodide/
          test -s _site/pyodide/pyodide.js
          test -s _site/pyodide/pyodide.mjs
          test -s _site/pyodide/pyodide.asm.mjs
          test -s _site/pyodide/pyodide.asm.wasm
          test -s _site/pyodide/python_stdlib.zip
          test -s _site/pyodide/pyodide-lock.json
          find _site/pyodide -maxdepth 1 -type f | sort
          echo "Pyodide core empacotado localmente."

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check pycode-worker.js
          node --check sw.js
          node --check professor-bot.js
          node --check aws-code-library.js
          node --check code-audit.js
          python3 -m py_compile pycode_worker.py
          python3 -m json.tool manifest.webmanifest >/dev/null
          node <<'NODE'
          const fs=require("fs");
          const {execFileSync}=require("child_process");
          const files=["index.html","jogo.html","diagnostico.html"];
          let n=0;
          for(const file of files){
            const html=fs.readFileSync(file,"utf8");
            const re=/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi;
            let m;
            while((m=re.exec(html))){
              if(!m[1].trim()) continue;
              const tmp="/tmp/pycode-inline-"+(++n)+".js";
              fs.writeFileSync(tmp,m[1]);
              execFileSync(process.execPath,["--check",tmp],{stdio:"inherit"});
            }
          }
          console.log("Inline JavaScript: OK");
          NODE
          if grep -R "cdn.jsdelivr.net/pyodide" -n . --exclude-dir=.git --exclude-dir=_cache --exclude-dir=_site; then
            echo "Referência proibida a CDN do Pyodide encontrada." >&2
            exit 1
          fi
          grep -q 'pycode-worker.js?v=37' index.html jogo.html diagnostico.html sw.js
          grep -q 'CACHE="py-code-v37"' sw.js
          echo "Offline/runtime invariants: OK"
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
