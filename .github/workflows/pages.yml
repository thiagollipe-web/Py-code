name: Deploy Py-Code Guided Learning

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate guided learning site
        run: |
          node --check academia.js
          node --check tutor.js
          node --check curriculo.js
          node --check sw.js
          node --test tests/tutor.test.cjs
          python3 -m json.tool manifest.webmanifest >/dev/null

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html academia.css academia.js curriculo.js tutor.js sw.js manifest.webmanifest _site/
          cp -R assets _site/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
