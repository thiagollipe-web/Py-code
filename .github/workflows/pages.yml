name: Deploy Py-Code Offline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          set -e
          mkdir -p _site/pyodide
          cp index.html jogo.html diagnostico.html manifest.webmanifest pycode-worker.js pycode_worker.py sw.js README.md _site/
          cp -R assets _site/assets

      - name: Bundle Pyodide completo localmente
        env:
          PYODIDE_VERSION: "314.0.7"
        run: |
          set -euo pipefail
          mkdir -p _cache/pyodide _site/pyodide
          archive="_cache/pyodide/pyodide-${PYODIDE_VERSION}.tar.bz2"
          url="https://github.com/pyodide/pyodide/releases/download/${PYODIDE_VERSION}/pyodide-${PYODIDE_VERSION}.tar.bz2"
          echo "Baixando distribuição completa do Pyodide..."
          curl --fail --location --retry 4 --retry-delay 2 "$url" -o "$archive"
          tar -xjf "$archive" -C _cache/pyodide --strip-components=1
          cp -R _cache/pyodide/. _site/pyodide/
          test -s _site/pyodide/pyodide.js
          test -s _site/pyodide/pyodide.asm.wasm
          test -s _site/pyodide/python_stdlib.zip
          test -s _site/pyodide/pyodide-lock.json
          find _site/pyodide -maxdepth 1 -type f | sort
          echo "Distribuição completa do Pyodide empacotada localmente."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
